<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-500 overflow-x-hidden text-gray-800 dark:text-gray-100 font-arabic">
    <div id="root"></div>
    <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- UTILS ---
        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} }
        };

        const playTone = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;
                
                if (type === 'click') {
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'success') {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.05, now + (i * 0.05));
                        g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.3);
                        o.start(now + (i * 0.05));
                        o.stop(now + (i * 0.05) + 0.4);
                    });
                }
            } catch (e) {}
        };

        // --- TRANSLATIONS ---
        const translations = {
            ar: {
                title: "متابع الورد", subtitle: "عادتك اليومية", welcome: "مرحباً",
                login: "دخول", register: "جديد", email: "البريد", pass: "كلمة المرور",
                submit: "انطلق", logout: "خروج", fajr: "الفجر", dhuhr: "الظهر",
                asr: "العصر", maghrib: "المغرب", isha: "العشاء", page: "ص",
                progress: "صفحة مكتملة", reset: "إعادة", online: "متصل",
                wait: "...", notStarted: "يبدأ 2026", completedMsg: "ما شاء الله!",
                from: "من", to: "إلى", surah: "سورة",
                streak: "أيام متتالية", settings: "الإعدادات", history: "السجل",
                pagesPerDay: "عدد الصفحات يومياً", save: "حفظ التغييرات", cancel: "إلغاء",
                shareTitle: "شارك إنجازك", copy: "نسخ النص", copied: "تم النسخ!",
                badges: "الأوسمة", badge1: "بداية الخير", badge3: "ثبات", badge7: "أسبوع كامل",
                shareText: "الحمد لله، أتممت وردي اليومي ({p} صفحات) من القرآن الكريم. 🕌✨ #MuslimHabit",
                dailyGoal: "هدف اليوم",
                daysLeft: "يوم للختمة", khatmasDone: "ختمات منجزة", date: "التاريخ"
            },
            en: {
                title: "Muslim Habit", subtitle: "Daily Tracker", welcome: "Hi",
                login: "Login", register: "New", email: "Email", pass: "Password",
                submit: "Go", logout: "Exit", fajr: "Fajr", dhuhr: "Dhuhr",
                asr: "Asr", maghrib: "Maghrib", isha: "Isha", page: "Pg",
                progress: "Pages Done", reset: "Reset", online: "Online",
                wait: "...", notStarted: "Starts 2026", completedMsg: "Great Job!",
                from: "From", to: "To", surah: "Surah",
                streak: "Streak", settings: "Settings", history: "History",
                pagesPerDay: "Pages per day", save: "Save Changes", cancel: "Cancel",
                shareTitle: "Share Progress", copy: "Copy Text", copied: "Copied!",
                badges: "Badges", badge1: "First Step", badge3: "Focus", badge7: "Full Week",
                shareText: "Alhamdulillah, completed my daily wird ({p} pages) of Quran. 🕌✨ #MuslimHabit",
                dailyGoal: "Daily Goal",
                daysLeft: "Days to Khatma", khatmasDone: "Khatmas Done", date: "Date"
            }
        };

        const Icon = ({ name, size = 20, className, onClick }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className} onClick={onClick}></i>;
        };

        // --- COMPONENTS ---

        const StatsGrid = ({ khatmas, daysLeft, lang }) => {
            const t = translations[lang];
            const dateStr = new Date().toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            
            return (
                <div className="grid grid-cols-3 gap-3">
                    <div className="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center flex flex-col items-center justify-center">
                        <Icon name="calendar-days" size={16} className="text-primary-500 mb-1" />
                        <span className="text-[10px] text-gray-400 font-bold">{t.date}</span>
                        <span className="text-xs font-bold dark:text-gray-200">{dateStr}</span>
                    </div>
                    <div className="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center flex flex-col items-center justify-center">
                        <Icon name="hourglass" size={16} className="text-orange-500 mb-1" />
                        <span className="text-[10px] text-gray-400 font-bold">{t.daysLeft}</span>
                        <span className="text-xs font-bold dark:text-gray-200">{daysLeft}</span>
                    </div>
                    <div className="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center flex flex-col items-center justify-center">
                        <Icon name="check-circle-2" size={16} className="text-gold-500 mb-1" />
                        <span className="text-[10px] text-gray-400 font-bold">{t.khatmasDone}</span>
                        <span className="text-xs font-bold dark:text-gray-200">{khatmas}</span>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose, initialPages, onSave, lang }) => {
            if (!isOpen) return null;
            const t = translations[lang];
            const [localPages, setLocalPages] = useState(initialPages);

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-3xl w-full max-w-sm shadow-2xl animate-slide-up">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-lg dark:text-white">{t.settings}</h3>
                            <button onClick={onClose}><Icon name="x" size={24} className="text-gray-500" /></button>
                        </div>
                        <div className="mb-6">
                            <label className="block text-sm text-gray-500 mb-2">{t.pagesPerDay}</label>
                            <div className="flex items-center gap-4 bg-gray-50 dark:bg-gray-700 p-3 rounded-2xl justify-between">
                                <button onClick={() => setLocalPages(Math.max(1, localPages - 1))} className="w-10 h-10 rounded-xl bg-white dark:bg-gray-600 shadow-sm font-bold text-xl hover:scale-105 transition">-</button>
                                <span className="text-2xl font-bold dark:text-white w-12 text-center">{localPages}</span>
                                <button onClick={() => setLocalPages(localPages + 1)} className="w-10 h-10 rounded-xl bg-primary-500 text-white shadow-sm font-bold text-xl hover:scale-105 transition">+</button>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onClose} className="flex-1 py-3 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-xl font-bold">{t.cancel}</button>
                            <button onClick={() => onSave(localPages)} className="flex-[2] py-3 bg-primary-600 text-white rounded-xl font-bold shadow-lg shadow-primary-500/20">{t.save}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ShareModal = ({ isOpen, onClose, pagesCount, lang }) => {
            if (!isOpen) return null;
            const t = translations[lang];
            const [copied, setCopied] = useState(false);
            
            const handleCopy = () => {
                const text = t.shareText.replace('{p}', pagesCount);
                navigator.clipboard.writeText(text);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                    <div className="glass p-6 rounded-3xl w-full max-w-sm shadow-2xl text-center animate-slide-up bg-white dark:bg-gray-900">
                        <div className="w-16 h-16 bg-gradient-to-tr from-gold-400 to-orange-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg animate-bounce-short">
                            <span className="text-3xl">🎉</span>
                        </div>
                        <h3 className="font-bold text-xl mb-2 dark:text-white">{t.shareTitle}</h3>
                        <div className="bg-gray-50 dark:bg-gray-800 p-4 rounded-xl mb-4 text-sm text-gray-600 dark:text-gray-300 italic">
                            "{t.shareText.replace('{p}', pagesCount)}"
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleCopy} className="flex-1 py-3 bg-primary-600 text-white rounded-xl font-bold flex items-center justify-center gap-2">
                                <Icon name={copied ? "check" : "copy"} size={18} /> {copied ? t.copied : t.copy}
                            </button>
                            <button onClick={onClose} className="p-3 bg-gray-100 dark:bg-gray-700 rounded-xl text-gray-500">
                                <Icon name="x" size={20} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const HistoryView = ({ user, lang }) => {
            const [history, setHistory] = useState({});
            const [loading, setLoading] = useState(true);
            const t = translations[lang];

            useEffect(() => {
                const fetchHistory = async () => {
                    const { collection, getDocs, query } = window.firebaseModules;
                    const q = query(collection(window.db, 'users', user.uid, 'daily_reads'));
                    const snap = await getDocs(q);
                    const data = {};
                    snap.forEach(doc => {
                        const prayers = doc.data().prayers || [];
                        const count = prayers.filter(p => p).length;
                        data[doc.id] = count;
                    });
                    setHistory(data);
                    setLoading(false);
                };
                fetchHistory();
            }, [user]);

            const date = new Date();
            const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
            const currentMonthStr = date.toISOString().slice(0, 7); 

            return (
                <div className="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 mt-4">
                    <h3 className="font-bold text-sm mb-4 flex items-center gap-2 dark:text-white">
                        <Icon name="calendar" size={16} className="text-primary-500" /> {t.history}
                    </h3>
                    {loading ? <div className="text-center text-xs text-gray-400">{t.wait}</div> : (
                        <div className="grid grid-cols-7 gap-2">
                            {days.map(d => {
                                const dayStr = `${currentMonthStr}-${String(d).padStart(2, '0')}`;
                                const count = history[dayStr] || 0;
                                let bgClass = 'bg-gray-100 dark:bg-gray-700 text-gray-400';
                                if (count === 5) bgClass = 'bg-primary-500 text-white shadow-sm';
                                else if (count > 0) bgClass = 'bg-gold-400 text-white';
                                
                                return (
                                    <div key={d} className={`h-8 w-8 rounded-lg flex items-center justify-center text-xs font-bold transition-all ${bgClass}`}>
                                        {d}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const BadgesRow = ({ streak, lang }) => {
            const t = translations[lang];
            const badges = [
                { id: 1, name: t.badge1, icon: 'star', min: 1, color: 'text-blue-500 bg-blue-50' },
                { id: 3, name: t.badge3, icon: 'zap', min: 3, color: 'text-gold-500 bg-orange-50' },
                { id: 7, name: t.badge7, icon: 'trophy', min: 7, color: 'text-purple-500 bg-purple-50' },
            ];

            return (
                <div className="flex gap-3 overflow-x-auto hide-scrollbar py-2">
                    {badges.map(b => {
                        const unlocked = streak >= b.min;
                        return (
                            <div key={b.id} className={`flex-shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-full border transition-all ${unlocked ? `${b.color} border-transparent shadow-sm` : 'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-400 grayscale opacity-50'}`}>
                                <Icon name={b.icon} size={14} />
                                <span className="text-[10px] font-bold">{b.name}</span>
                            </div>
                        )
                    })}
                </div>
            );
        };

        // --- DASHBOARD ---
        const Dashboard = ({ user, lang, setLang }) => {
            const t = translations[lang];
            const [prayers, setPrayers] = useState([false, false, false, false, false]);
            const [settings, setSettings] = useState({ pagesPerDay: 5 });
            const [verseInfo, setVerseInfo] = useState(null);
            const [streak, setStreak] = useState(0);
            
            const [showSettings, setShowSettings] = useState(false);
            const [showShare, setShowShare] = useState(false);

            const today = new Date().toISOString().split('T')[0];
            const prayerNames = [t.fajr, t.dhuhr, t.asr, t.maghrib, t.isha];
            const prayerIcons = ['sunrise', 'sun', 'cloud-sun', 'sunset', 'moon'];

            const pageData = useMemo(() => {
                const start2026 = new Date('2026-01-01').getTime();
                const now = new Date().getTime();
                const diff = Math.floor((now - start2026) / (1000 * 60 * 60 * 24));
                if (diff < 0) return null;
                const p = parseInt(settings.pagesPerDay);
                const startPage = (diff * p) + 1;
                return { start: startPage, end: startPage + p - 1 };
            }, [settings.pagesPerDay]);
            
            // --- NEW STATS CALCULATIONS ---
            const stats = useMemo(() => {
                if (!pageData) return { khatmas: 0, daysLeft: 0 };
                const QURAN_PAGES = 604;
                const currentAbsolutePage = pageData.start;
                const khatmasCompleted = Math.floor(currentAbsolutePage / QURAN_PAGES);
                const pagesRemainingInCurrentKhatma = QURAN_PAGES - (currentAbsolutePage % QURAN_PAGES);
                const daysLeft = Math.ceil(pagesRemainingInCurrentKhatma / settings.pagesPerDay);
                return { khatmas: khatmasCompleted, daysLeft: daysLeft };
            }, [pageData, settings.pagesPerDay]);


            useEffect(() => {
                const fetchData = async () => {
                    const { doc, getDoc } = window.firebaseModules;
                    const userDocRef = doc(window.db, 'users', user.uid);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        if (data.settings && data.settings.pagesPerDay) setSettings(data.settings);
                        if (data.streak) setStreak(data.streak);
                    }
                    const readsDocRef = doc(window.db, 'users', user.uid, 'daily_reads', today);
                    const readsSnap = await getDoc(readsDocRef);
                    if (readsSnap.exists()) setPrayers(readsSnap.data().prayers || [false,false,false,false,false]);
                };
                fetchData();
            }, [user]);

            useEffect(() => {
                if (!pageData) return;
                const fetchQuran = async () => {
                    setVerseInfo(null);
                    const cacheKey = `quran_${pageData.start}_${pageData.end}`;
                    const cached = safeStorage.getItem(cacheKey);
                    if (cached) { setVerseInfo(JSON.parse(cached)); return; }

                    try {
                        const resStart = await fetch(`https://api.alquran.cloud/v1/page/${pageData.start}/quran-uthmani`);
                        const dataStart = await resStart.json();
                        const sSurah = dataStart.data.ayahs[0].surah;
                        const sAyah = dataStart.data.ayahs[0].numberInSurah;

                        let eSurah = sSurah, eAyah = sAyah;
                        if (pageData.start !== pageData.end) {
                            const resEnd = await fetch(`https://api.alquran.cloud/v1/page/${pageData.end}/quran-uthmani`);
                            const dataEnd = await resEnd.json();
                            const lastIdx = dataEnd.data.ayahs.length - 1;
                            eSurah = dataEnd.data.ayahs[lastIdx].surah;
                            eAyah = dataEnd.data.ayahs[lastIdx].numberInSurah;
                        }

                        const info = {
                            start: { name: lang==='ar'?sSurah.name:sSurah.englishName, ayah: sAyah },
                            end: { name: lang==='ar'?eSurah.name:eSurah.englishName, ayah: eAyah }
                        };
                        safeStorage.setItem(cacheKey, JSON.stringify(info));
                        setVerseInfo(info);
                    } catch (e) {}
                };
                fetchQuran();
            }, [pageData, lang]);

            const handleCheck = async (index) => {
                const newPrayers = [...prayers];
                newPrayers[index] = !newPrayers[index];
                if (newPrayers[index]) playTone('success'); else playTone('click');
                setPrayers(newPrayers);

                const completed = newPrayers.filter(p => p).length;
                if (completed === 5 && !prayers.every(p => p)) {
                    const canvas = document.getElementById('confetti-canvas');
                    if(canvas) {
                        const ctx = canvas.getContext('2d');
                        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                        let particles = Array.from({length: 60}, () => ({x: canvas.width/2, y: canvas.height/2, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, color: `hsl(${Math.random()*360},100%,50%)`}));
                        let op = 1;
                        const draw = () => { ctx.clearRect(0,0,canvas.width,canvas.height); op-=0.02; particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.color;ctx.globalAlpha=op;ctx.fillRect(p.x,p.y,5,5)}); if(op>0)requestAnimationFrame(draw); };
                        draw();
                    }
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    setTimeout(() => setShowShare(true), 1500);
                    const { doc, setDoc } = window.firebaseModules;
                    await setDoc(doc(window.db, 'users', user.uid), { streak: newStreak }, { merge: true });
                }

                const { doc, setDoc } = window.firebaseModules;
                await setDoc(doc(window.db, 'users', user.uid, 'daily_reads', today), { prayers: newPrayers, updatedAt: new Date().toISOString() }, { merge: true });
            };

            const handleSaveSettings = async (newPages) => {
                setShowSettings(false);
                setSettings({ ...settings, pagesPerDay: newPages });
                const { doc, setDoc } = window.firebaseModules;
                await setDoc(doc(window.db, 'users', user.uid), { settings: { pagesPerDay: newPages } }, { merge: true });
            };

            const completedPrayers = prayers.filter(p => p).length;
            const progressPercent = (completedPrayers / 5) * 100;
            const isAllDone = completedPrayers === 5;
            const pagesTotal = parseInt(settings.pagesPerDay);
            const pagesDone = Math.round((completedPrayers / 5) * pagesTotal);
            const pagesPerPrayer = pagesTotal / 5;

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20 font-sans" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    <div className="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-primary-400 to-primary-600 flex items-center justify-center text-white font-bold shadow-lg">
                                {user.email[0].toUpperCase()}
                            </div>
                            <div>
                                <h2 className="text-sm font-bold text-gray-800 dark:text-white">{t.welcome}</h2>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-bold flex items-center gap-1">🔥 {streak}</span>
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-xs font-bold text-gray-600 dark:text-gray-300">{lang === 'ar' ? 'EN' : 'ع'}</button>
                            <button onClick={() => setShowSettings(true)} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 flex items-center justify-center"><Icon name="settings" size={14} /></button>
                            <button onClick={() => window.auth.signOut()} className="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100"><Icon name="log-out" size={14} /></button>
                        </div>
                    </div>

                    <div className="p-6 max-w-lg mx-auto space-y-6 animate-fade-in">
                        <div className={`relative overflow-hidden rounded-3xl p-6 shadow-xl transition-all duration-500 ${isAllDone ? 'bg-gradient-to-r from-gold-400 to-orange-500' : 'bg-gradient-to-br from-primary-600 to-primary-800'} text-white`}>
                            <div className="relative z-10 flex justify-between items-end">
                                <div>
                                    <p className="text-sm opacity-90 mb-1 font-medium">{t.progress}</p>
                                    <h1 className="text-4xl font-bold font-quran">{isAllDone ? "🎉" : `${pagesDone}/${pagesTotal}`}</h1>
                                </div>
                                <div className="text-right">
                                     <button onClick={() => setShowShare(true)} className="bg-white/20 hover:bg-white/30 p-2 rounded-xl backdrop-blur-sm transition"><Icon name="share-2" size={20} className="text-white" /></button>
                                </div>
                            </div>
                            <div className="w-full bg-black/20 rounded-full h-2 mt-4 overflow-hidden backdrop-blur-sm">
                                <div className="h-full bg-white/90 rounded-full transition-all duration-700 ease-out" style={{ width: `${progressPercent}%` }}></div>
                            </div>
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                        </div>

                        {/* NEW STATS GRID */}
                        <StatsGrid khatmas={stats.khatmas} daysLeft={stats.daysLeft} lang={lang} />
                        
                        <BadgesRow streak={streak} lang={lang} />

                        <div className="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-3 relative overflow-hidden">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-2 text-primary-600">
                                    <Icon name="book-open" size={18} />
                                    <span className="font-bold text-sm">{t.subtitle}</span>
                                </div>
                                <span className="text-[10px] bg-primary-50 text-primary-600 px-2 py-1 rounded-lg font-bold">
                                    {settings.pagesPerDay} {t.page} / {t.dailyGoal}
                                </span>
                            </div>
                            
                            {!pageData ? (
                                <p className="text-center text-gray-400 text-sm py-2">{t.notStarted}</p>
                            ) : (
                                <div className="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 rounded-xl p-3 transition-all duration-300">
                                    {!verseInfo ? (
                                        <div className="w-full text-center py-2 text-gray-400 text-xs animate-pulse">{t.wait}</div>
                                    ) : (
                                        <>
                                            <div className="text-center w-1/2 border-e border-gray-200 dark:border-gray-600 px-2">
                                                <span className="text-[10px] text-gray-400 block mb-1">{t.from}</span>
                                                <p className="font-quran font-bold text-gray-800 dark:text-gray-200 text-sm truncate animate-fade-in">{`${t.surah} ${verseInfo.start.name}`}</p>
                                                <span className="text-xs text-primary-500 font-bold">{t.page} {pageData.start}</span>
                                            </div>
                                            <div className="text-center w-1/2 px-2">
                                                <span className="text-[10px] text-gray-400 block mb-1">{t.to}</span>
                                                <p className="font-quran font-bold text-gray-800 dark:text-gray-200 text-sm truncate animate-fade-in">{`${t.surah} ${verseInfo.end.name}`}</p>
                                                <span className="text-xs text-primary-500 font-bold">{t.page} {pageData.end}</span>
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="space-y-3">
                            {prayerNames.map((name, idx) => (
                                <label key={idx} className={`group flex items-center justify-between p-4 rounded-2xl border transition-all duration-300 cursor-pointer ${prayers[idx] ? 'bg-primary-50 dark:bg-primary-900/20 border-primary-200 dark:border-primary-800' : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700 hover:border-primary-300'}`}>
                                    <div className="flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${prayers[idx] ? 'bg-primary-500 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-400'}`}>
                                            <Icon name={prayerIcons[idx]} size={20} />
                                        </div>
                                        <div>
                                            <h3 className={`font-bold text-lg ${prayers[idx] ? 'text-primary-700 dark:text-primary-300' : 'text-gray-700 dark:text-gray-300'}`}>{name}</h3>
                                            {pageData && (
                                                <span className="text-[10px] text-gray-400 font-medium">
                                                    {t.page} <span className="font-bold font-sans">{(pageData.start + Math.floor(idx * pagesPerPrayer))}</span>
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                    <div className="checkbox-wrapper relative w-7 h-7">
                                        <input type="checkbox" className="absolute opacity-0 w-full h-full cursor-pointer z-10" checked={prayers[idx]} onChange={() => handleCheck(idx)} />
                                        <div className={`w-full h-full rounded-full border-2 flex items-center justify-center transition-all duration-300 ${prayers[idx] ? 'bg-primary-500 border-primary-500 scale-110' : 'border-gray-300 dark:border-gray-600 bg-transparent'}`}>
                                            <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline className="checkmark" points="20 6 9 17 4 12"></polyline></svg>
                                        </div>
                                    </div>
                                </label>
                            ))}
                        </div>
                        <HistoryView user={user} lang={lang} />
                    </div>
                    <SettingsModal isOpen={showSettings} onClose={() => setShowSettings(false)} initialPages={settings.pagesPerDay} onSave={handleSaveSettings} lang={lang} />
                    <ShareModal isOpen={showShare} onClose={() => setShowShare(false)} pagesCount={pagesDone} lang={lang} />
                </div>
            );
        };

        const AuthScreen = ({ lang, setLang }) => {
            const [isLogin, setIsLogin] = useState(true); const [email, setEmail] = useState(''); const [pass, setPass] = useState(''); const [loading, setLoading] = useState(false); const t = translations[lang];
            const handleSubmit = async (e) => { e.preventDefault(); setLoading(true); const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseModules; try { if (isLogin) await signInWithEmailAndPassword(window.auth, email, pass); else await createUserWithEmailAndPassword(window.auth, email, pass); } catch (e) { alert(e.message); setLoading(false); } };
            return ( <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-primary-50 to-white dark:from-gray-900 dark:to-gray-800"> <div className="glass w-full max-w-md p-8 rounded-3xl shadow-xl animate-slide-up bg-white/80 dark:bg-gray-800/80"> <div className="flex justify-between items-center mb-6"> <button onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')} className="text-xs font-bold text-gray-500">{lang === 'ar' ? 'EN' : 'ع'}</button> <div className="w-12 h-12 bg-primary-100 rounded-xl flex items-center justify-center text-2xl">🕌</div> </div> <h1 className="text-2xl font-bold mb-6 text-center dark:text-white">{t.title}</h1> <form onSubmit={handleSubmit} className="space-y-4"> <input type="email" placeholder={t.email} value={email} onChange={e => setEmail(e.target.value)} required className="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-700 border-none outline-none dark:text-white" /> <input type="password" placeholder={t.pass} value={pass} onChange={e => setPass(e.target.value)} required className="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-700 border-none outline-none dark:text-white" /> <div className="flex gap-2 pt-2"> <button type="button" onClick={() => setIsLogin(!isLogin)} className="flex-1 py-3 text-gray-500 text-sm">{isLogin ? t.register : t.login}</button> <button type="submit" disabled={loading} className="flex-[2] py-3 bg-primary-600 text-white rounded-xl font-bold shadow-lg shadow-primary-500/30">{loading ? t.wait : t.submit}</button> </div> </form> </div> </div> );
        };

        const App = () => {
            const [user, setUser] = useState(null); const [lang, setLang] = useState(safeStorage.getItem('appLang') || 'ar');
            useEffect(() => { const darkQuery = window.matchMedia('(prefers-color-scheme: dark)'); if (darkQuery.matches) document.documentElement.classList.add('dark'); }, []);
            useEffect(() => { const { onAuthStateChanged } = window.firebaseModules; const unsub = onAuthStateChanged(window.auth, (u) => setUser(u)); return () => unsub(); }, []);
            useEffect(() => { document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; safeStorage.setItem('appLang', lang); if(lang === 'ar') document.body.classList.add('font-arabic'); else document.body.classList.remove('font-arabic'); }, [lang]);
            return user ? <Dashboard user={user} lang={lang} setLang={setLang} /> : <AuthScreen lang={lang} setLang={setLang} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
