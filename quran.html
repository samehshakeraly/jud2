<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متابع الورد (وضع التشخيص)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 950: '#022c22' },
                        gold: { 500: '#d4af37' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        /* Debug Console Styles */
        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: #111;
            color: #0f0;
            font-family: monospace;
            font-size: 10px;
            padding: 10px;
            overflow-y: scroll;
            z-index: 999999;
            border-top: 2px solid #333;
            direction: ltr;
            text-align: left;
            opacity: 0.9;
        }
        .log-error { color: #ff3333; font-weight: bold; }
        .log-warn { color: #ffcc00; }
        .log-info { color: #00ccff; }
        
        /* App Styles */
        .quran-font { font-family: 'Amiri', serif; }
        .glass-card { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .prayer-checkbox:checked + div { background-color: #10b981; border-color: #059669; color: white; }
        .prayer-checkbox:checked + div .page-num { color: #d1fae5; }
        .auth-input { @apply w-full px-4 py-3 rounded-xl border border-gray-200 outline-none bg-white/50; }
        .status-online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-offline { background-color: #ef4444; }
        .cloud-status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body id="bodyEl" class="min-h-screen flex flex-col items-center justify-center p-4 bg-[#f0fdf4] text-slate-800 pb-40">

    <!-- Debug Console -->
    <div id="debug-console">
        <div>> System Initialized...</div>
    </div>

    <!-- Logger Script -->
    <script>
        function logToScreen(msg, type='info') {
            const consoleDiv = document.getElementById('debug-console');
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            if(type === 'error') entry.className = 'log-error';
            if(type === 'warn') entry.className = 'log-warn';
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(msg); // Also log to browser console
        }

        window.onerror = function(msg, url, line, col, error) {
            logToScreen(`CRITICAL ERROR: ${msg} (Line: ${line})`, 'error');
            return false;
        };

        logToScreen("Waiting for Firebase...");
    </script>

    <div id="audioUnlocker" class="fixed inset-0 z-[99999] opacity-0" style="display: none;" onclick="unlockAudioContext()"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // --- مفاتيحك ---
        const firebaseConfig = {
            apiKey: "AIzaSyBSMaNzhzKCtfQcL7kyCoz6CWmQM4pMsds",
            authDomain: "muslimhabit-b21fd.firebaseapp.com",
            projectId: "muslimhabit-b21fd",
            storageBucket: "muslimhabit-b21fd.firebasestorage.app",
            messagingSenderId: "250434152968",
            appId: "1:250434152968:web:3b9ed463db1c0e873a3fbd",
            measurementId: "G-9BR2F65RGC"
        };

        let app, auth, db;
        let currentUser = null;
        let unsubscribeDoc = null;

        // دوال الحماية
        function safeSetText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
            else logToScreen(`Element #${id} not found for text update`, 'warn');
        }
        function safeSetClass(id, className, action) {
            const el = document.getElementById(id);
            if (el) {
                if(action === 'add') el.classList.add(className);
                if(action === 'remove') el.classList.remove(className);
            }
        }
        function safeSetStyle(id, property, value) {
            const el = document.getElementById(id);
            if (el) el.style[property] = value;
        }

        try {
            logToScreen("Initializing Firebase App...");
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            logToScreen("Firebase Initialized Successfully.");

            onAuthStateChanged(auth, (user) => {
                logToScreen(`Auth State Changed: ${user ? 'Logged In (' + user.email + ')' : 'Logged Out'}`);
                currentUser = user;
                
                const authScreen = document.getElementById('authScreen');
                const mainApp = document.getElementById('mainApp');
                
                if (user) {
                    if(authScreen) authScreen.classList.add('hidden');
                    if(mainApp) mainApp.classList.remove('hidden');
                    
                    safeSetText('userEmailDisplay', user.email);
                    safeSetClass('cloudIndicator', 'status-online', 'add');
                    safeSetClass('cloudIndicator', 'status-offline', 'remove');
                    safeSetText('cloudText', 'متصل');
                    
                    // استدعاء التحميل
                    logToScreen("Fetching data for today...");
                    window.firebaseAPI.subscribeToDate(getStorageKey(), (data) => {
                        logToScreen("Data received from Firestore.");
                        currentPrayersState = data;
                        renderPrayersList();
                    });

                } else {
                    if(authScreen) authScreen.classList.remove('hidden');
                    if(mainApp) mainApp.classList.add('hidden');
                }
            });

            window.authAPI = {
                login: async (email, password) => {
                    logToScreen(`Attempting login for: ${email}`);
                    try { await signInWithEmailAndPassword(auth, email, password); } 
                    catch (e) { 
                        logToScreen(`Login Error: ${e.code}`, 'error');
                        throw translateAuthError(e.code); 
                    }
                },
                register: async (email, password) => {
                    logToScreen(`Attempting register for: ${email}`);
                    try { await createUserWithEmailAndPassword(auth, email, password); } 
                    catch (e) { 
                        logToScreen(`Register Error: ${e.code}`, 'error');
                        throw translateAuthError(e.code); 
                    }
                },
                logout: async () => {
                    if (unsubscribeDoc) unsubscribeDoc();
                    await signOut(auth);
                }
            };

            window.firebaseAPI = {
                subscribeToDate: (dateStr, callback) => {
                    if (!db || !currentUser) return;
                    if (unsubscribeDoc) unsubscribeDoc();
                    const docPath = doc(db, 'users', currentUser.uid, 'daily_reads', dateStr);
                    unsubscribeDoc = onSnapshot(docPath, (snap) => {
                        if (snap.exists()) callback(snap.data().prayers || [false,false,false,false,false]);
                        else callback([false,false,false,false,false]);
                    }, (error) => {
                        logToScreen(`Firestore Read Error: ${error.message}`, 'error');
                    });
                },
                saveProgress: async (dateStr, data) => {
                    if (!db || !currentUser) return;
                    const docPath = doc(db, 'users', currentUser.uid, 'daily_reads', dateStr);
                    try {
                        await setDoc(docPath, { prayers: data, lastUpdated: new Date().toISOString() }, { merge: true });
                        logToScreen("Progress saved successfully.");
                    } catch (error) {
                        logToScreen(`Save Error: ${error.message}`, 'error');
                    }
                }
            };

        } catch (e) {
            logToScreen(`INIT CRITICAL: ${e.message}`, 'error');
            alert("خطأ في الاتصال: " + e.message);
        }

        function translateAuthError(code) {
            return code; // Return raw code for debugging
        }
    </script>

    <!-- Auth Screen -->
    <div id="authScreen" class="w-full max-w-md p-8 glass-card rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-800">تشخيص الأخطاء 🛠️</h1>
            <p class="text-sm text-gray-500">سجل الدخول وراقب المربع الأسود بالأسفل</p>
        </div>
        <form onsubmit="handleAuth(event)" class="space-y-4">
            <input type="email" id="email" required class="auth-input" placeholder="البريد الإلكتروني">
            <input type="password" id="password" required class="auth-input" placeholder="كلمة المرور">
            <div id="authError" class="hidden text-xs text-red-500 bg-red-50 p-2 rounded"></div>
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white py-3 rounded-xl">دخول</button>
            <div class="flex gap-2 mt-2">
                <button type="button" onclick="switchAuthMode('login')" class="text-xs text-gray-500">لدي حساب</button>
                <button type="button" onclick="switchAuthMode('register')" class="text-xs text-emerald-600">إنشاء جديد</button>
            </div>
        </form>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden w-full max-w-md glass-card rounded-3xl p-6 bg-white/90">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-lg">👤</div>
                <div class="flex flex-col">
                    <span id="userEmailDisplay" class="text-[10px] text-gray-500 font-mono">...</span>
                    <div class="flex items-center gap-1">
                        <span id="cloudIndicator" class="cloud-status status-offline"></span>
                        <span id="cloudText" class="text-[9px] text-gray-400">غير متصل</span>
                    </div>
                </div>
            </div>
            <button onclick="logoutUser()" class="text-xs text-red-500">خروج</button>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-800">وِرد اليوم</h1>
            <p id="dateDisplay" class="text-sm text-gray-500 mt-1">...</p>
            <div class="w-full bg-gray-200 rounded-full h-2 mt-3">
                <div id="dailyProgressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressLabel" class="text-xs text-gray-500 mt-2">0 من 5 صلوات</p>
        </div>

        <div id="prayersList" class="space-y-3"></div>
    </div>

    <script>
        // --- Helper Logic ---
        let currentAuthMode = 'login';
        function switchAuthMode(mode) { currentAuthMode = mode; alert("تم التبديل إلى: " + mode); }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('authError');
            errorDiv.classList.add('hidden');

            try {
                if(!window.authAPI) throw "Firebase not ready";
                if(currentAuthMode === 'login') await window.authAPI.login(email, password);
                else await window.authAPI.register(email, password);
            } catch(err) {
                errorDiv.textContent = err;
                errorDiv.classList.remove('hidden');
                logToScreen(`Auth Fail: ${err}`, 'error');
            }
        }

        function logoutUser() { if(confirm("خروج؟")) window.authAPI.logout(); }

        const START_DATE_STR = '2026-01-01';
        const PAGES_PER_DAY = 5;
        const QURAN_PAGES = 604;
        let currentPrayersState = [false,false,false,false,false];
        const prayers = [{id:0,name:"الفجر",icon:"🌅"},{id:1,name:"الظهر",icon:"☀️"},{id:2,name:"العصر",icon:"⛅"},{id:3,name:"المغرب",icon:"🌇"},{id:4,name:"العشاء",icon:"🌌"}];

        function getStorageKey() {
            return new Date().toISOString().split('T')[0];
        }

        function togglePrayer(index) {
            const dateStr = getStorageKey();
            const newData = [...currentPrayersState];
            newData[index] = !newData[index];
            currentPrayersState = newData; 
            renderPrayersList();
            if (window.firebaseAPI) window.firebaseAPI.saveProgress(dateStr, newData);
        }

        function renderPrayersList() {
            const listContainer = document.getElementById('prayersList');
            if(!listContainer) { logToScreen("Error: #prayersList not found!", 'error'); return; }
            
            listContainer.innerHTML = '';
            let completedCount = 0;

            prayers.forEach((prayer, index) => {
                const isChecked = currentPrayersState[index];
                if (isChecked) completedCount++;
                let pageNumDisplay = 0; // Simplified for debug

                const item = document.createElement('div');
                item.innerHTML = `
                    <label class="cursor-pointer block relative group">
                        <input type="checkbox" class="prayer-checkbox hidden" onchange="togglePrayer(${index})" ${isChecked ? 'checked' : ''}>
                        <div class="prayer-item flex items-center justify-between p-3 rounded-xl border border-gray-200 bg-white">
                            <div class="flex items-center gap-3">
                                <div class="icon-box w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-lg">${prayer.icon}</div>
                                <span class="font-bold text-sm text-gray-800">${prayer.name}</span>
                            </div>
                            <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center">${isChecked ? '✓' : ''}</div>
                        </div>
                    </label>
                `;
                listContainer.appendChild(item);
            });

            const percentage = (completedCount / 5) * 100;
            safeSetStyle('dailyProgressBar', 'width', `${percentage}%`);
            safeSetText('progressLabel', `${completedCount} من 5 صلوات`);
        }

        function updateUI() {
            const now = new Date();
            safeSetText('dateDisplay', now.toLocaleDateString('ar-KW'));
        }
        
        // Initial Run
        updateUI();
    </script>
</body>
</html>
