<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muslim Habit | متابع الورد</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        arabic: ['Cairo', 'sans-serif'],
                        quran: ['Amiri', 'serif'],
                    },
                    colors: {
                        primary: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 900: '#064e3b' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        pop: { '0%': { transform: 'scale(0.8)' }, '50%': { transform: 'scale(1.1)' }, '100%': { transform: 'scale(1)' } }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBSMaNzhzKCtfQcL7kyCoz6CWmQM4pMsds",
            authDomain: "muslimhabit-b21fd.firebaseapp.com",
            projectId: "muslimhabit-b21fd",
            storageBucket: "muslimhabit-b21fd.firebasestorage.app",
            messagingSenderId: "250434152968",
            appId: "1:250434152968:web:3b9ed463db1c0e873a3fbd"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseModules = { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, doc, onSnapshot, setDoc };
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .dark .glass { background: rgba(6, 78, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Custom Checkbox Animation */
        .checkbox-wrapper input:checked + div { background-color: #10b981; border-color: #10b981; }
        .checkbox-wrapper input:checked + div svg { stroke-dashoffset: 0; }
        .checkmark { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 0.4s ease-in-out; }
        
        /* Confetti Canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-500 overflow-hidden text-gray-800 dark:text-gray-100">
    <div id="root"></div>
    <canvas id="confetti-canvas"></canvas>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SAFE STORAGE UTILITY ---
        // Prevents crashes in environments where localStorage is restricted (e.g., sandboxed iframes)
        const safeStorage = {
            getItem: (key) => {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.warn('LocalStorage access denied', e);
                    return null;
                }
            },
            setItem: (key, value) => {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.warn('LocalStorage access denied', e);
                }
            }
        };

        // --- SOUND SYSTEM (Web Audio API) ---
        const playTone = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;
                
                if (type === 'click') {
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'success') {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.05, now + (i * 0.05));
                        g.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.05) + 0.3);
                        o.start(now + (i * 0.05));
                        o.stop(now + (i * 0.05) + 0.4);
                    });
                } else if (type === 'complete') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'triangle';
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.1, now + (i * 0.1));
                        g.gain.linearRampToValueAtTime(0, now + (i * 0.1) + 0.6);
                        o.start(now + (i * 0.1));
                        o.stop(now + (i * 0.1) + 0.6);
                    });
                }
            } catch (e) {
                console.error("Sound error:", e);
            }
        };

        // --- TRANSLATIONS ---
        const translations = {
            ar: {
                title: "متابع الورد",
                subtitle: "عادتك اليومية",
                welcome: "مرحباً بك",
                login: "تسجيل دخول",
                register: "حساب جديد",
                email: "البريد الإلكتروني",
                pass: "كلمة المرور",
                submit: "انطلق",
                logout: "خروج",
                fajr: "الفجر",
                dhuhr: "الظهر",
                asr: "العصر",
                maghrib: "المغرب",
                isha: "العشاء",
                page: "صفحة",
                progress: "مكتمل",
                reset: "إعادة تعيين",
                online: "متصل",
                offline: "غير متصل",
                wait: "انتظر...",
                notStarted: "لم يبدأ الورد بعد (يبدأ 2026)",
                completedMsg: "أحسنت! أتممت ورد اليوم",
                from: "من", to: "إلى", surah: "سورة"
            },
            en: {
                title: "Muslim Habit",
                subtitle: "Daily Tracker",
                welcome: "Welcome",
                login: "Login",
                register: "Register",
                email: "Email Address",
                pass: "Password",
                submit: "Let's Go",
                logout: "Logout",
                fajr: "Fajr",
                dhuhr: "Dhuhr",
                asr: "Asr",
                maghrib: "Maghrib",
                isha: "Isha",
                page: "Page",
                progress: "Completed",
                reset: "Reset Today",
                online: "Online",
                offline: "Offline",
                wait: "Wait...",
                notStarted: "Program starts 2026",
                completedMsg: "Mashallah! All done.",
                from: "From", to: "To", surah: "Surah"
            }
        };

        // --- CONFETTI LOGIC ---
        const fireConfetti = () => {
            const canvas = document.getElementById('confetti-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#10b981', '#f59e0b', '#3b82f6', '#ef4444'];
            
            for(let i=0; i<100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 5 + 2
                });
            }
            
            let opacity = 1;
            const animate = () => {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                opacity -= 0.01;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // gravity
                    ctx.globalAlpha = opacity;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                
                if(opacity > 0) requestAnimationFrame(animate);
                else ctx.clearRect(0,0, canvas.width, canvas.height);
            };
            animate();
        };

        // --- COMPONENTS ---

        const Icon = ({ name, size = 20, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // 1. Auth Component
        const AuthScreen = ({ lang, setLang, onLogin }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const t = translations[lang];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseModules;
                
                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(window.auth, email, pass);
                    } else {
                        await createUserWithEmailAndPassword(window.auth, email, pass);
                    }
                } catch (err) {
                    setError(err.message.replace('Firebase:', '').trim());
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden bg-gradient-to-br from-primary-50 to-white dark:from-primary-900 dark:to-gray-900">
                    {/* Decorative Background */}
                    <div className="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
                    <div className="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-gold-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

                    <div className="glass w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 animate-slide-up">
                        <div className="flex justify-between items-center mb-8">
                            <button onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition">
                                <span className="font-bold text-sm text-primary-600 dark:text-primary-400">{lang === 'ar' ? 'EN' : 'عربي'}</span>
                            </button>
                            <div className="w-12 h-12 bg-primary-100 rounded-2xl flex items-center justify-center text-2xl shadow-inner">🕌</div>
                        </div>

                        <h1 className="text-3xl font-bold mb-2 text-center text-gray-800 dark:text-white font-arabic">{t.title}</h1>
                        <p className="text-center text-gray-500 mb-8 text-sm">{t.subtitle}</p>

                        <div className="flex p-1 bg-gray-100 dark:bg-gray-800 rounded-xl mb-6">
                            <button onClick={() => setIsLogin(true)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${isLogin ? 'bg-white dark:bg-primary-600 text-primary-600 dark:text-white shadow-sm' : 'text-gray-500'}`}>{t.login}</button>
                            <button onClick={() => setIsLogin(false)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${!isLogin ? 'bg-white dark:bg-primary-600 text-primary-600 dark:text-white shadow-sm' : 'text-gray-500'}`}>{t.register}</button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="email" placeholder={t.email} value={email} onChange={e => setEmail(e.target.value)} required 
                                className="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:border-primary-500 outline-none transition dark:text-white dir-auto" />
                            <input type="password" placeholder={t.pass} value={pass} onChange={e => setPass(e.target.value)} required 
                                className="w-full p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 focus:border-primary-500 outline-none transition dark:text-white dir-auto" />
                            
                            {error && <p className="text-red-500 text-xs text-center bg-red-50 p-2 rounded-lg">{error}</p>}

                            <button type="submit" disabled={loading} className="w-full py-4 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-bold shadow-lg shadow-primary-500/30 transform active:scale-95 transition flex items-center justify-center gap-2">
                                {loading ? t.wait : t.submit}
                                {!loading && <Icon name={lang === 'ar' ? 'arrow-left' : 'arrow-right'} size={18} />}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 2. Main Dashboard Component
        const Dashboard = ({ user, lang, setLang }) => {
            const t = translations[lang];
            const [prayers, setPrayers] = useState([false, false, false, false, false]);
            const [verseInfo, setVerseInfo] = useState(null);
            const [loading, setLoading] = useState(true);
            const today = new Date().toISOString().split('T')[0]; // Simple date key

            const prayerNames = [t.fajr, t.dhuhr, t.asr, t.maghrib, t.isha];
            const prayerIcons = ['sunrise', 'sun', 'cloud-sun', 'sunset', 'moon'];
            
            // Calculate Quran Page Logic (Based on 2026 Start)
            const getPageRange = () => {
                const start2026 = new Date('2026-01-01').getTime();
                const now = new Date().getTime();
                const diff = Math.floor((now - start2026) / (1000 * 60 * 60 * 24));
                
                if (diff < 0) return null;
                
                const startPage = (diff * 5) + 1;
                return { start: startPage, end: startPage + 4 };
            };

            const pageData = useMemo(() => getPageRange(), []);

            // Firebase Listener
            useEffect(() => {
                const { doc, onSnapshot } = window.firebaseModules;
                const userDoc = doc(window.db, 'users', user.uid, 'daily_reads', today);
                
                const unsub = onSnapshot(userDoc, (snap) => {
                    if (snap.exists()) {
                        setPrayers(snap.data().prayers || [false, false, false, false, false]);
                    }
                    setLoading(false);
                });
                return () => unsub();
            }, [user]);

            // Quran API Fetcher
            useEffect(() => {
                if (!pageData) return;
                const fetchQuran = async () => {
                    try {
                        const cacheKey = `quran_${pageData.start}`;
                        const cached = safeStorage.getItem(cacheKey); // SAFE STORAGE CALL
                        if (cached) {
                            setVerseInfo(JSON.parse(cached));
                            return;
                        }

                        // Fetch Start and End Ayah info
                        const resStart = await fetch(`https://api.alquran.cloud/v1/page/${pageData.start}/quran-uthmani`);
                        const dataStart = await resStart.json();
                        const sSurah = dataStart.data.ayahs[0].surah;
                        const sAyah = dataStart.data.ayahs[0].numberInSurah;

                        const resEnd = await fetch(`https://api.alquran.cloud/v1/page/${pageData.end}/quran-uthmani`);
                        const dataEnd = await resEnd.json();
                        const lastIdx = dataEnd.data.ayahs.length - 1;
                        const eSurah = dataEnd.data.ayahs[lastIdx].surah;
                        const eAyah = dataEnd.data.ayahs[lastIdx].numberInSurah;

                        const info = {
                            start: { name: lang==='ar'?sSurah.name:sSurah.englishName, ayah: sAyah },
                            end: { name: lang==='ar'?eSurah.name:eSurah.englishName, ayah: eAyah }
                        };
                        
                        safeStorage.setItem(cacheKey, JSON.stringify(info)); // SAFE STORAGE CALL
                        setVerseInfo(info);
                    } catch (e) { console.error(e); }
                };
                fetchQuran();
            }, [pageData, lang]);

            const handleCheck = async (index) => {
                const newPrayers = [...prayers];
                newPrayers[index] = !newPrayers[index];
                
                // Sound FX
                if (newPrayers[index]) {
                    playTone('success');
                    if (newPrayers.every(p => p)) {
                        setTimeout(() => {
                            playTone('complete');
                            fireConfetti();
                        }, 500);
                    }
                } else {
                    playTone('click');
                }

                // Optimistic UI Update
                setPrayers(newPrayers);

                // Save to DB
                const { doc, setDoc } = window.firebaseModules;
                await setDoc(doc(window.db, 'users', user.uid, 'daily_reads', today), {
                    prayers: newPrayers,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            };

            const completedCount = prayers.filter(p => p).length;
            const progress = (completedCount / 5) * 100;
            const isAllDone = completedCount === 5;

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20 font-sans" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    {/* Header */}
                    <div className="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-primary-400 to-primary-600 flex items-center justify-center text-white font-bold shadow-lg">
                                {user.email[0].toUpperCase()}
                            </div>
                            <div>
                                <h2 className="text-sm font-bold text-gray-800 dark:text-white">{t.welcome}</h2>
                                <p className="text-[10px] text-primary-600 flex items-center gap-1">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> {t.online}
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-xs font-bold text-gray-600 dark:text-gray-300">
                                {lang === 'ar' ? 'EN' : 'ع'}
                            </button>
                            <button onClick={() => window.auth.signOut()} className="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition">
                                <Icon name="log-out" size={14} />
                            </button>
                        </div>
                    </div>

                    <div className="p-6 max-w-lg mx-auto space-y-6 animate-fade-in">
                        
                        {/* Progress Card */}
                        <div className={`relative overflow-hidden rounded-3xl p-6 shadow-xl transition-all duration-500 ${isAllDone ? 'bg-gradient-to-r from-gold-400 to-orange-500' : 'bg-gradient-to-br from-primary-600 to-primary-800'} text-white`}>
                            <div className="relative z-10 text-center">
                                <h1 className="text-4xl font-bold mb-1 font-quran">{isAllDone ? "🎉" : `${completedCount}/5`}</h1>
                                <p className="text-sm opacity-90 mb-4 font-medium">{isAllDone ? t.completedMsg : t.progress}</p>
                                
                                <div className="w-full bg-black/20 rounded-full h-3 overflow-hidden backdrop-blur-sm">
                                    <div className="h-full bg-white/90 rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(255,255,255,0.5)]" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                            
                            {/* Decorative Circles */}
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                            <div className="absolute bottom-0 left-0 w-24 h-24 bg-white opacity-5 rounded-full translate-y-1/2 -translate-x-1/2"></div>
                        </div>

                        {/* Quran Info Card */}
                        <div className="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-3">
                            <div className="flex items-center gap-2 text-primary-600">
                                <Icon name="book-open" size={18} />
                                <span className="font-bold text-sm">{t.subtitle}</span>
                            </div>
                            
                            {!pageData ? (
                                <p className="text-center text-gray-400 text-sm py-2">{t.notStarted}</p>
                            ) : (
                                <div className="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 rounded-xl p-3">
                                    <div className="text-center w-1/2 border-e border-gray-200 dark:border-gray-600 px-2">
                                        <span className="text-[10px] text-gray-400 block mb-1">{t.from}</span>
                                        <p className="font-quran font-bold text-gray-800 dark:text-gray-200 text-sm">
                                            {verseInfo ? `${t.surah} ${verseInfo.start.name}` : '...'}
                                        </p>
                                        <span className="text-xs text-primary-500 font-bold">{t.page} {pageData.start}</span>
                                    </div>
                                    <div className="text-center w-1/2 px-2">
                                        <span className="text-[10px] text-gray-400 block mb-1">{t.to}</span>
                                        <p className="font-quran font-bold text-gray-800 dark:text-gray-200 text-sm">
                                            {verseInfo ? `${t.surah} ${verseInfo.end.name}` : '...'}
                                        </p>
                                        <span className="text-xs text-primary-500 font-bold">{t.page} {pageData.end}</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Prayer List */}
                        <div className="space-y-3">
                            {prayerNames.map((name, idx) => (
                                <label key={idx} className={`group flex items-center justify-between p-4 rounded-2xl border transition-all duration-300 cursor-pointer ${prayers[idx] ? 'bg-primary-50 dark:bg-primary-900/20 border-primary-200 dark:border-primary-800' : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700 hover:border-primary-300'}`}>
                                    <div className="flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${prayers[idx] ? 'bg-primary-500 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-400'}`}>
                                            <Icon name={prayerIcons[idx]} size={20} />
                                        </div>
                                        <div>
                                            <h3 className={`font-bold text-lg ${prayers[idx] ? 'text-primary-700 dark:text-primary-300' : 'text-gray-700 dark:text-gray-300'}`}>{name}</h3>
                                            {pageData && (
                                                <span className="text-[10px] text-gray-400 font-medium">
                                                    {t.page} <span className="font-bold font-sans">{(pageData.start + idx)}</span>
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    {/* Custom Animated Checkbox */}
                                    <div className="checkbox-wrapper relative w-7 h-7">
                                        <input type="checkbox" className="absolute opacity-0 w-full h-full cursor-pointer z-10" checked={prayers[idx]} onChange={() => handleCheck(idx)} />
                                        <div className={`w-full h-full rounded-full border-2 flex items-center justify-center transition-all duration-300 ${prayers[idx] ? 'bg-primary-500 border-primary-500 scale-110' : 'border-gray-300 dark:border-gray-600 bg-transparent'}`}>
                                            <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                                <polyline className="checkmark" points="20 6 9 17 4 12"></polyline>
                                            </svg>
                                        </div>
                                    </div>
                                </label>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Root App
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            // SAFE STORAGE CALL FOR INITIAL STATE
            const [lang, setLang] = useState(safeStorage.getItem('appLang') || 'ar');

            useEffect(() => {
                const { onAuthStateChanged } = window.firebaseModules;
                const unsub = onAuthStateChanged(window.auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                safeStorage.setItem('appLang', lang); // SAFE STORAGE CALL
                
                // Adjust font based on language
                if(lang === 'ar') document.body.classList.add('font-arabic');
                else document.body.classList.remove('font-arabic');
            }, [lang]);

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary-500"></div>
                </div>
            );

            return user ? 
                <Dashboard user={user} lang={lang} setLang={setLang} /> : 
                <AuthScreen lang={lang} setLang={setLang} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
