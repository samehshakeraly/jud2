<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muslim Habit | الذكي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        arabic: ['Almarai', 'sans-serif'],
                        quran: ['Amiri', 'serif'],
                    },
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        accent: { 400: '#fbbf24', 500: '#f59e0b' },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleIn: { '0%': { transform: 'scale(0.9)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Outfit:wght@300;400;600;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc, getDoc, collection, query, getDocs, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBSMaNzhzKCtfQcL7kyCoz6CWmQM4pMsds",
            authDomain: "muslimhabit-b21fd.firebaseapp.com",
            projectId: "muslimhabit-b21fd",
            storageBucket: "muslimhabit-b21fd.firebasestorage.app",
            messagingSenderId: "250434152968",
            appId: "1:250434152968:web:3b9ed463db1c0e873a3fbd"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseModules = { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, doc, onSnapshot, setDoc, getDoc, collection, query, getDocs, orderBy, limit };
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .app-bg { background-color: #f8fafc; background-image: radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.1) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%); }
        .dark .app-bg { background-color: #0f172a; background-image: radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.05) 0px, transparent 50%); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .modern-checkbox input:checked + div { background-color: #0ea5e9; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        .modern-checkbox input:checked + div svg { stroke-dashoffset: 0; }
        .checkmark { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 0.4s ease-in-out; }
        .ai-gradient { background: linear-gradient(135deg, #0ea5e9 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="app-bg transition-colors duration-500 overflow-x-hidden text-slate-800 dark:text-slate-100 font-arabic selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const safeStorage = { getItem: (k) => { try { return localStorage.getItem(k) } catch(e) { return null } }, setItem: (k,v) => { try { localStorage.setItem(k,v) } catch(e) {} } };
        const playTone = (type) => { try { const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); const now = ctx.currentTime; if (type === 'click') { osc.frequency.setValueAtTime(800, now); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.1); } else if (type === 'success') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); } } catch(e) {} };

        // --- GEMINI API (Safe Mode) ---
        const callGeminiAPI = async (prompt) => {
            const userKey = safeStorage.getItem('gemini_api_key');
            if (!userKey) return "⚠️ يرجى إضافة مفتاح API في الإعدادات.";

            // Using 1.5-flash for better compatibility
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userKey}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.error) {
                    console.error("Gemini API Error:", data.error);
                    return "خطأ في المفتاح أو الخدمة.";
                }
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "لا يوجد رد.";
            } catch (e) {
                return "خطأ في الاتصال.";
            }
        };

        const translations = {
            ar: {
                welcome: "أهلاً بك،", dashboard: "لوحة الإنجاز", settings: "الإعدادات", share: "مشاركة", logout: "خروج",
                streak: "أيام متتالية", todayGoal: "هدف اليوم", pages: "صفحة", completed: "مكتمل", 
                daysLeft: "يوم متبقي", khatmas: "الختمات", fajr: "الفجر", dhuhr: "الظهر", asr: "العصر", maghrib: "المغرب", isha: "العشاء",
                save: "حفظ", cancel: "إلغاء", pagesPerDay: "كم صفحة تريد أن تقرأ يومياً؟",
                from: "من", to: "إلى", surah: "سورة", ayah: "الآية", wait: "...",
                insights: "المحلل الذكي", insightsDesc: "تحليل سلوكك باستخدام الذكاء الاصطناعي",
                chartPrayers: "الالتزام حسب الصلاة", chartDays: "الالتزام الأسبوعي",
                aiTitle: "الموجه الروحي (Gemini)", aiLoading: "جاري الاستشارة...", 
                aiAdvice: "نصيحة مخصصة لك:", aiPattern: "تحليل النمط",
                tadabburBtn: "✨ وقفة تدبر", tadabburTitle: "رسالة لك من القرآن", askAI: "✨ استشارة عميقة",
                apiKeyLabel: "مفتاح الذكاء الاصطناعي (API Key)", apiKeyPlace: "الصق المفتاح هنا..."
            },
            en: {
                welcome: "Hello,", dashboard: "Dashboard", settings: "Settings", share: "Share", logout: "Logout",
                streak: "Streak", todayGoal: "Today's Goal", pages: "Pages", completed: "Done", 
                daysLeft: "Days Left", khatmas: "Khatmas", fajr: "Fajr", dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha",
                save: "Save", cancel: "Cancel", pagesPerDay: "Pages per day?",
                from: "From", to: "To", surah: "Surah", ayah: "Ayah", wait: "...",
                insights: "Smart Analyst", insightsDesc: "AI-driven behavior analysis",
                chartPrayers: "Prayer Commitment", chartDays: "Weekly Consistency",
                aiTitle: "Spiritual Coach (Gemini)", aiLoading: "Consulting AI...",
                aiAdvice: "Personalized Advice:", aiPattern: "Pattern Analysis",
                tadabburBtn: "✨ Reflect (AI)", tadabburTitle: "Reflection", askAI: "✨ Deep Insight",
                apiKeyLabel: "Gemini API Key", apiKeyPlace: "Paste key here..."
            }
        };

        const Icon = ({ name, size = 20, className, onClick }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.setAttribute('width', size);
                    i.setAttribute('height', size);
                    if (className) i.className = className;
                    spanRef.current.appendChild(i);
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, size, className]);
            return <span ref={spanRef} onClick={onClick} style={{ display: 'inline-flex', cursor: onClick ? 'pointer' : 'inherit' }}></span>;
        };

        // --- COMPONENTS ---
        const InsightCharts = ({ historyData, lang }) => {
            const chartRef1 = useRef(null);
            const chartRef2 = useRef(null);
            const t = translations[lang];

            useEffect(() => {
                if (!historyData || historyData.length === 0) return;
                const prayerCounts = [0,0,0,0,0]; const dayCounts = [0,0,0,0,0,0,0];
                historyData.forEach(entry => {
                    if (entry.prayers) {
                        entry.prayers.forEach((done, idx) => {
                            if(done) { prayerCounts[idx]++; const dayIndex = new Date(entry.date).getDay(); dayCounts[dayIndex]++; }
                        });
                    }
                });

                const ctx1 = document.getElementById('prayerChart').getContext('2d');
                if (chartRef1.current) chartRef1.current.destroy();
                chartRef1.current = new Chart(ctx1, { type: 'bar', data: { labels: [t.fajr, t.dhuhr, t.asr, t.maghrib, t.isha], datasets: [{ label: t.completed, data: prayerCounts, backgroundColor: 'rgba(14, 165, 233, 0.6)', borderRadius: 6 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } } });

                const ctx2 = document.getElementById('weeklyChart').getContext('2d');
                if (chartRef2.current) chartRef2.current.destroy();
                chartRef2.current = new Chart(ctx2, { type: 'line', data: { labels: lang === 'ar' ? ['أحد','اثنين','ث','أ','خ','ج','س'] : ['Su','Mo','Tu','We','Th','Fr','Sa'], datasets: [{ label: t.completed, data: dayCounts, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.4 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } } });
            }, [historyData, lang]);

            return (
                <div className="grid grid-cols-2 gap-3 mt-4">
                    <div className="glass-panel p-3 rounded-3xl"><h4 className="text-[10px] font-bold text-slate-400 mb-2 uppercase">{t.chartPrayers}</h4><canvas id="prayerChart" height="150"></canvas></div>
                    <div className="glass-panel p-3 rounded-3xl"><h4 className="text-[10px] font-bold text-slate-400 mb-2 uppercase">{t.chartDays}</h4><canvas id="weeklyChart" height="150"></canvas></div>
                </div>
            );
        };

        const SmartAnalysisCard = ({ historyData, lang, t }) => {
            const [aiAdvice, setAiAdvice] = useState(null);
            const [loading, setLoading] = useState(false);

            const handleAskAI = async () => {
                setLoading(true);
                let summary = "";
                if(historyData && historyData.length > 0) {
                    const total = historyData.length;
                    const prayerCounts = [0,0,0,0,0];
                    historyData.forEach(d => d.prayers?.forEach((p, i) => p && prayerCounts[i]++));
                    summary = `Last ${total} days: Fajr: ${prayerCounts[0]}, Dhuhr: ${prayerCounts[1]}, Asr: ${prayerCounts[2]}, Maghrib: ${prayerCounts[3]}, Isha: ${prayerCounts[4]}.`;
                } else { summary = "User is new."; }

                const prompt = lang === 'ar' ? `تصرف كمدرب روحي. بيانات المستخدم: [${summary}]. أعط نصيحة قصيرة جداً (30 كلمة) تشجعه. لا تذكر أرقاماً.` : `Act as spiritual coach. User data: [${summary}]. Give short advice (30 words). No numbers.`;
                const result = await callGeminiAPI(prompt);
                setAiAdvice(result);
                setLoading(false);
            };

            return (
                <div className="bg-gradient-to-br from-brand-900 to-brand-700 text-white p-6 rounded-[2rem] mt-6 shadow-xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-accent-500 rounded-full mix-blend-overlay filter blur-[50px] opacity-30"></div>
                    <div className="relative z-10">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-2"><Icon name="sparkles" className="text-accent-400 animate-pulse" size={18} /><h3 className="font-bold text-lg">{t.aiTitle}</h3></div>
                            <button onClick={handleAskAI} disabled={loading} className="text-[10px] bg-white/20 hover:bg-white/30 backdrop-blur px-3 py-1.5 rounded-full font-bold transition flex items-center gap-1">{loading ? <Icon name="loader-2" size={12} className="animate-spin" /> : <Icon name="zap" size={12} />}{loading ? t.wait : t.askAI}</button>
                        </div>
                        {loading ? <div className="py-4 text-center text-xs text-brand-200 animate-pulse">{t.aiLoading}</div> : aiAdvice ? <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/10 animate-fade-in"><p className="text-xs text-accent-300 uppercase font-bold mb-2">{t.aiAdvice}</p><p className="text-sm leading-relaxed font-medium">{aiAdvice}</p></div> : <div className="text-center py-4 text-xs text-brand-200 opacity-80">اضغط للحصول على توجيه خاص.</div>}
                    </div>
                </div>
            );
        };

        const InsightsModal = ({ isOpen, onClose, historyData, lang }) => {
            if (!isOpen) return null;
            const t = translations[lang];
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md animate-fade-in overflow-y-auto">
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] w-full max-w-lg shadow-2xl animate-scale-in border border-slate-100 dark:border-slate-700 my-8 overflow-hidden">
                        <div className="flex justify-between items-center mb-2"><div><h3 className="font-bold text-2xl dark:text-white flex items-center gap-2 ai-gradient"><Icon name="brain-circuit" /> {t.insights}</h3><p className="text-xs text-slate-400 mt-1">{t.insightsDesc}</p></div><button onClick={onClose} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-full"><Icon name="x" size={20} /></button></div>
                        <SmartAnalysisCard historyData={historyData} lang={lang} t={t} />
                        <InsightCharts historyData={historyData} lang={lang} />
                    </div>
                </div>
            );
        };

        const HeroCard = ({ streak, pagesDone, pagesTotal, lang }) => {
            const t = translations[lang];
            const isDone = pagesDone >= pagesTotal;
            return (
                <div className="relative overflow-hidden rounded-[2.5rem] bg-slate-900 text-white shadow-2xl p-8 mb-6 transition-transform hover:scale-[1.01] duration-500">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-brand-500 rounded-full mix-blend-overlay filter blur-[80px] opacity-20 animate-pulse"></div>
                    <div className="absolute bottom-0 left-0 w-48 h-48 bg-accent-500 rounded-full mix-blend-overlay filter blur-[60px] opacity-20"></div>
                    <div className="relative z-10 flex flex-col gap-6">
                        <div className="flex justify-between items-start">
                            <div><span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-xs font-bold text-accent-400 mb-2"><Icon name="flame" size={12} /> {streak} {t.streak}</span><h2 className="text-4xl font-bold font-sans tracking-tight">{isDone ? "🎉" : `${Math.round((pagesDone/pagesTotal)*100)}%`}<span className="text-lg font-normal text-slate-400 ml-2">{t.completed}</span></h2></div>
                            <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-glow text-white"><Icon name="book-open" size={24} /></div>
                        </div>
                        <div><div className="flex justify-between text-xs text-slate-400 mb-2 font-bold"><span>{pagesDone} {t.pages}</span><span>{pagesTotal} {t.pages}</span></div><div className="h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-700"><div className="h-full bg-gradient-to-r from-brand-400 to-brand-500 transition-all duration-1000 ease-out relative" style={{ width: `${(pagesDone/pagesTotal)*100}%` }}><div className="absolute inset-0 bg-white/20 animate-[shimmer_2s_infinite]"></div></div></div></div>
                    </div>
                </div>
            );
        };

        const InfoGrid = ({ khatmas, daysLeft, lang }) => {
            const t = translations[lang];
            const dateStr = new Date().toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', { day: 'numeric', month: 'short' });
            const Item = ({ icon, label, val, color }) => (
                <div className="glass-panel p-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-transform hover:-translate-y-1 duration-300"><div className={`p-3 rounded-full ${color} bg-opacity-10 text-opacity-100`}><Icon name={icon} size={20} className={color.replace('bg-', 'text-')} /></div><div className="text-center"><p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{label}</p><p className="text-lg font-bold text-slate-800 dark:text-white">{val}</p></div></div>
            );
            return ( <div className="grid grid-cols-3 gap-4 mb-6"><Item icon="calendar" label={t.todayGoal} val={dateStr} color="bg-brand-500" /><Item icon="hourglass" label={t.daysLeft} val={daysLeft} color="bg-accent-500" /><Item icon="trophy" label={t.khatmas} val={khatmas} color="bg-purple-500" /></div> );
        };

        const ReadingScopeCard = ({ verseInfo, pageData, lang }) => {
            const t = translations[lang];
            const [tadabbur, setTadabbur] = useState(null);
            const [loading, setLoading] = useState(false);

            if (!verseInfo || !pageData) return null;

            const handleTadabbur = async () => {
                setLoading(true);
                const prompt = lang === 'ar' ? `خاطرة تدبرية قصيرة (20 كلمة) عن سورة ${verseInfo.start.name} آية ${verseInfo.start.ayah}.` : `Short spiritual reflection (20 words) on Surah ${verseInfo.start.name} ayah ${verseInfo.start.ayah}.`;
                const result = await callGeminiAPI(prompt);
                setTadabbur(result);
                setLoading(false);
            };

            return (
                <div className="glass-panel p-5 rounded-3xl mb-8 border-l-4 border-l-brand-500 flex flex-col gap-3 relative overflow-hidden">
                    <div className="absolute right-0 top-0 opacity-5 -translate-y-1/2 translate-x-1/2"><Icon name="book" size={100} /></div>
                    <div className="flex justify-between items-center relative z-10">
                        <div className="flex-1"><span className="text-[10px] text-slate-400 font-bold uppercase mb-1 block">{t.from}</span><h4 className="font-quran font-bold text-xl text-slate-800 dark:text-white">{t.surah} {verseInfo.start.name}</h4><span className="text-xs text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-900/30 px-2 py-0.5 rounded-lg inline-block mt-1">{t.ayah} {verseInfo.start.ayah}</span></div>
                        <div className="px-4 text-slate-300 dark:text-slate-600"><Icon name={lang === 'ar' ? 'arrow-left' : 'arrow-right'} size={20} /></div>
                        <div className="flex-1 text-left" style={{textAlign: lang === 'ar' ? 'left' : 'right'}}><span className="text-[10px] text-slate-400 font-bold uppercase mb-1 block">{t.to}</span><h4 className="font-quran font-bold text-xl text-slate-800 dark:text-white">{t.surah} {verseInfo.end.name}</h4><span className="text-xs text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-900/30 px-2 py-0.5 rounded-lg inline-block mt-1">{t.ayah} {verseInfo.end.ayah}</span></div>
                    </div>
                    <div className="relative z-10 mt-2">
                        {loading ? <div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-2xl flex items-center justify-center gap-2 text-xs text-brand-600 animate-pulse"><Icon name="loader-2" size={14} className="animate-spin" /> {t.wait}</div> : tadabbur ? <div className="bg-brand-50 dark:bg-brand-900/20 p-4 rounded-2xl border border-brand-100 dark:border-brand-900/30 animate-fade-in"><div className="flex items-center gap-2 mb-2"><Icon name="sparkles" size={14} className="text-accent-500" /><span className="text-[10px] font-bold text-brand-700 dark:text-brand-300 uppercase">{t.tadabburTitle}</span></div><p className="text-sm font-quran text-slate-700 dark:text-slate-200 leading-relaxed text-center">"{tadabbur}"</p></div> : <button onClick={handleTadabbur} className="w-full py-3 mt-1 rounded-2xl border border-dashed border-brand-300 dark:border-brand-700 text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition flex items-center justify-center gap-2 text-xs font-bold"><Icon name="sparkles" size={14} /> {t.tadabburBtn}</button>}
                    </div>
                    <div className="text-center mt-2 border-t border-slate-100 dark:border-slate-700 pt-2"><span className="text-[10px] text-slate-400">{t.pages}: <b className="text-slate-600 dark:text-slate-300">{pageData.start} - {pageData.end}</b></span></div>
                </div>
            );
        };

        const PrayerItem = ({ name, icon, checked, pageInfo, onCheck }) => (
            <div onClick={onCheck} className={`group relative overflow-hidden p-5 rounded-3xl cursor-pointer transition-all duration-300 border ${checked ? 'bg-brand-50 dark:bg-brand-900/20 border-brand-200 dark:border-brand-800' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 hover:border-brand-300'}`}>
                <div className="flex items-center justify-between relative z-10">
                    <div className="flex items-center gap-4">
                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center transition-colors duration-300 ${checked ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'}`}><Icon name={icon} size={22} /></div>
                        <div><h3 className={`font-bold text-lg ${checked ? 'text-brand-700 dark:text-brand-400' : 'text-slate-700 dark:text-slate-300'}`}>{name}</h3><p className="text-xs text-slate-400 font-bold mt-0.5">{pageInfo}</p></div>
                    </div>
                    <div className="modern-checkbox relative w-8 h-8"><input type="checkbox" className="absolute inset-0 opacity-0 cursor-pointer" checked={checked} readOnly /><div className={`w-full h-full rounded-xl border-2 flex items-center justify-center transition-all duration-300 ${checked ? 'border-brand-500 bg-brand-500' : 'border-slate-300 dark:border-slate-600'}`}><svg className="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline className="checkmark" points="20 6 9 17 4 12"></polyline></svg></div></div>
                </div>
            </div>
        );

        const SettingsModal = ({ isOpen, onClose, initialPages, onSave, lang }) => {
            if (!isOpen) return null;
            const t = translations[lang];
            const [localPages, setLocalPages] = useState(initialPages);
            const [apiKey, setApiKey] = useState(safeStorage.getItem('gemini_api_key') || '');

            const handleSave = () => {
                safeStorage.setItem('gemini_api_key', apiKey);
                onSave(localPages);
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl animate-scale-in border border-slate-100 dark:border-slate-700">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚙️</div>
                            <h3 className="font-bold text-xl dark:text-white">{t.settings}</h3>
                        </div>
                        
                        <div className="mb-6">
                            <p className="text-sm text-slate-400 mb-2 font-bold">{t.pagesPerDay}</p>
                            <div className="flex items-center justify-center gap-6">
                                <button onClick={() => setLocalPages(Math.max(1, localPages - 1))} className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-xl font-bold transition">-</button>
                                <span className="text-4xl font-extrabold text-brand-600 dark:text-brand-400">{localPages}</span>
                                <button onClick={() => setLocalPages(localPages + 1)} className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-xl font-bold transition">+</button>
                            </div>
                        </div>

                        <div className="mb-8 bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl">
                            <p className="text-xs text-slate-400 mb-2 font-bold">{t.apiKeyLabel}</p>
                            <input 
                                type="password" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)} 
                                placeholder={t.apiKeyPlace}
                                className="w-full p-2 rounded-xl bg-white dark:bg-slate-600 border border-slate-200 dark:border-slate-500 text-sm focus:border-brand-500 outline-none transition"
                            />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={onClose} className="py-4 rounded-2xl font-bold text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700 transition">{t.cancel}</button>
                            <button onClick={handleSave} className="py-4 rounded-2xl font-bold bg-brand-600 text-white shadow-lg shadow-brand-500/30 hover:scale-[1.02] transition">{t.save}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, lang, setLang }) => {
            const t = translations[lang];
            const [prayers, setPrayers] = useState([false, false, false, false, false]);
            const [settings, setSettings] = useState({ pagesPerDay: 5 });
            const [streak, setStreak] = useState(0);
            const [verseInfo, setVerseInfo] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [showInsights, setShowInsights] = useState(false);
            const [historyData, setHistoryData] = useState([]);
            
            // Check if API key is missing to show alert dot
            const [hasApiKey, setHasApiKey] = useState(!!safeStorage.getItem('gemini_api_key'));
            
            const today = new Date().toISOString().split('T')[0];
            const prayerNames = [t.fajr, t.dhuhr, t.asr, t.maghrib, t.isha];
            const prayerIcons = ['sunrise', 'sun', 'cloud-sun', 'sunset', 'moon'];

            const pageData = useMemo(() => {
                const start2026 = new Date('2026-01-01').getTime();
                const now = new Date().getTime();
                const diff = Math.floor((now - start2026) / (1000 * 60 * 60 * 24));
                if (diff < 0) return null;
                const p = parseInt(settings.pagesPerDay);
                const startPage = (diff * p) + 1;
                return { start: startPage, end: startPage + p - 1 };
            }, [settings.pagesPerDay]);

            const stats = useMemo(() => {
                if (!pageData) return { khatmas: 0, daysLeft: 0 };
                const QURAN_PAGES = 604;
                const currentAbsolutePage = pageData.start;
                const khatmas = Math.floor(currentAbsolutePage / QURAN_PAGES);
                const remaining = QURAN_PAGES - (currentAbsolutePage % QURAN_PAGES);
                const days = Math.ceil(remaining / settings.pagesPerDay);
                return { khatmas, daysLeft: days };
            }, [pageData, settings.pagesPerDay]);

            useEffect(() => {
                if (!pageData) return;
                const fetchQuran = async () => {
                    const cacheKey = `quran_${pageData.start}_${pageData.end}`;
                    const cached = safeStorage.getItem(cacheKey);
                    if (cached) { setVerseInfo(JSON.parse(cached)); return; }
                    try {
                        const resStart = await fetch(`https://api.alquran.cloud/v1/page/${pageData.start}/quran-uthmani`);
                        const dataStart = await resStart.json();
                        let sSurah = dataStart.data.ayahs[0].surah, sAyah = dataStart.data.ayahs[0].numberInSurah, eSurah = sSurah, eAyah = sAyah;
                        if (pageData.start !== pageData.end) {
                            const resEnd = await fetch(`https://api.alquran.cloud/v1/page/${pageData.end}/quran-uthmani`);
                            const dataEnd = await resEnd.json();
                            const lastIdx = dataEnd.data.ayahs.length - 1;
                            eSurah = dataEnd.data.ayahs[lastIdx].surah; eAyah = dataEnd.data.ayahs[lastIdx].numberInSurah;
                        }
                        const info = { start: { name: lang==='ar'?sSurah.name:sSurah.englishName, ayah: sAyah }, end: { name: lang==='ar'?eSurah.name:eSurah.englishName, ayah: eAyah } };
                        safeStorage.setItem(cacheKey, JSON.stringify(info));
                        setVerseInfo(info);
                    } catch (e) {}
                };
                fetchQuran();
            }, [pageData, lang]);

            useEffect(() => {
                const init = async () => {
                    const { doc, getDoc, collection, query, getDocs, orderBy, limit } = window.firebaseModules;
                    const uSnap = await getDoc(doc(window.db, 'users', user.uid));
                    if (uSnap.exists()) {
                        const d = uSnap.data();
                        if (d.settings?.pagesPerDay) setSettings(d.settings);
                        if (d.streak) setStreak(d.streak);
                    }
                    const pSnap = await getDoc(doc(window.db, 'users', user.uid, 'daily_reads', today));
                    if (pSnap.exists()) setPrayers(pSnap.data().prayers || [false,false,false,false,false]);

                    const q = query(collection(window.db, 'users', user.uid, 'daily_reads'), orderBy('updatedAt', 'desc'), limit(30));
                    const hSnap = await getDocs(q);
                    const history = [];
                    hSnap.forEach(d => history.push({ date: d.id, ...d.data() }));
                    setHistoryData(history);
                };
                init();
            }, []);

            const handleCheck = async (index) => {
                const newPrayers = [...prayers];
                newPrayers[index] = !newPrayers[index];
                if (newPrayers[index]) playTone('success'); else playTone('click');
                setPrayers(newPrayers);
                const count = newPrayers.filter(p=>p).length;
                if (count === 5 && !prayers.every(p=>p)) {
                    const canvas = document.getElementById('confetti-canvas');
                    if(canvas) {
                        const ctx = canvas.getContext('2d');
                        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                        let particles = Array.from({length: 80}, () => ({x: canvas.width/2, y: canvas.height/2, vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25, color: `hsl(${Math.random()*360},100%,50%)`}));
                        let op = 1;
                        const draw = () => { ctx.clearRect(0,0,canvas.width,canvas.height); op-=0.02; particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.color;ctx.globalAlpha=op;ctx.fillRect(p.x,p.y,6,6)}); if(op>0)requestAnimationFrame(draw); };
                        draw();
                    }
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    window.firebaseModules.setDoc(window.firebaseModules.doc(window.db, 'users', user.uid), { streak: newStreak }, { merge: true });
                }
                window.firebaseModules.setDoc(window.firebaseModules.doc(window.db, 'users', user.uid, 'daily_reads', today), { prayers: newPrayers, updatedAt: new Date().toISOString() }, { merge: true });
            };

            const completed = prayers.filter(p => p).length;
            const totalPages = parseInt(settings.pagesPerDay);
            const donePages = Math.round((completed/5)*totalPages);
            const pagesPerPrayer = totalPages / 5;

            return (
                <div className="min-h-screen pb-20 pt-6 px-6 font-sans" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    <div className="flex justify-between items-center mb-8">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden border-2 border-white dark:border-slate-600 shadow-sm">
                                <div className="w-full h-full flex items-center justify-center font-bold text-slate-500 dark:text-slate-300 text-lg">{user.email[0].toUpperCase()}</div>
                            </div>
                            <div>
                                <p className="text-xs text-slate-400 font-bold">{t.welcome}</p>
                                <h1 className="text-xl font-bold text-slate-800 dark:text-white">Muslim Habit</h1>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setLang(l => l==='ar'?'en':'ar')} className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center text-xs font-bold border border-slate-100 dark:border-slate-700">{lang==='ar'?'EN':'ع'}</button>
                            <button onClick={() => setShowInsights(true)} className="w-10 h-10 rounded-full bg-accent-50 dark:bg-accent-900/20 shadow-sm flex items-center justify-center border border-accent-100 dark:border-accent-800 text-accent-600 dark:text-accent-400 hover:scale-105 transition"><Icon name="bar-chart-2" size={18} /></button>
                            <button onClick={() => setShowSettings(true)} className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 relative">
                                <Icon name="settings" size={18} />
                                {!hasApiKey && <span className="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>}
                            </button>
                        </div>
                    </div>

                    <div className="max-w-md mx-auto animate-fade-in">
                        <HeroCard streak={streak} pagesDone={donePages} pagesTotal={totalPages} lang={lang} />
                        <InfoGrid khatmas={stats.khatmas} daysLeft={stats.daysLeft} lang={lang} />
                        <ReadingScopeCard verseInfo={verseInfo} pageData={pageData} lang={lang} />
                        <div className="flex items-center gap-2 mb-4 mt-2"><Icon name="list-todo" size={18} className="text-brand-500" /><h3 className="font-bold text-lg text-slate-800 dark:text-white">{t.todayGoal}</h3></div>
                        <div className="space-y-3">
                            {prayerNames.map((name, idx) => ( <PrayerItem key={idx} name={name} icon={prayerIcons[idx]} checked={prayers[idx]} pageInfo={pageData ? `${t.pages} ${Math.floor(pageData.start + (idx * pagesPerPrayer))}` : '...'} onCheck={() => handleCheck(idx)} /> ))}
                        </div>
                    </div>

                    <SettingsModal isOpen={showSettings} onClose={() => setShowSettings(false)} initialPages={settings.pagesPerDay} onSave={async (val) => { setShowSettings(false); setSettings({ ...settings, pagesPerDay: val }); setHasApiKey(!!safeStorage.getItem('gemini_api_key')); await window.firebaseModules.setDoc(window.firebaseModules.doc(window.db, 'users', user.uid), { settings: { pagesPerDay: val } }, { merge: true }); }} lang={lang} />
                    <InsightsModal isOpen={showInsights} onClose={() => setShowInsights(false)} historyData={historyData} lang={lang} />
                </div>
            );
        };

        const AuthScreen = ({ lang, setLang }) => {
            const [isLogin, setIsLogin] = useState(true); const [email, setEmail] = useState(''); const [pass, setPass] = useState(''); const t = translations[lang];
            const handleAuth = async (e) => { e.preventDefault(); try { const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseModules; if(isLogin) await signInWithEmailAndPassword(window.auth, email, pass); else await createUserWithEmailAndPassword(window.auth, email, pass); } catch(e) { alert(e.message) } };
            return ( <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-brand-50 to-white dark:from-slate-900 dark:to-slate-800"> <div className="glass-panel w-full max-w-sm p-10 rounded-[2.5rem] shadow-2xl animate-scale-in text-center relative overflow-hidden"> <div className="w-20 h-20 bg-gradient-to-tr from-brand-400 to-brand-600 rounded-3xl mx-auto mb-6 flex items-center justify-center text-4xl shadow-glow text-white rotate-3">🕌</div> <h1 className="text-3xl font-extrabold mb-2 text-slate-800 dark:text-white font-sans tracking-tight">Muslim Habit</h1> <p className="text-sm text-slate-400 mb-8">{t.shareText}</p> <form onSubmit={handleAuth} className="space-y-4"> <input type="email" placeholder={t.email} value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-600 focus:border-brand-500 outline-none transition" required /> <input type="password" placeholder={t.pass} value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-600 focus:border-brand-500 outline-none transition" required /> <button className="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold shadow-lg shadow-brand-500/30 transition-transform active:scale-95">{isLogin ? t.login : t.register}</button> </form> <button onClick={() => setIsLogin(!isLogin)} className="mt-6 text-sm text-slate-500 font-bold hover:text-brand-600 transition">{isLogin ? t.register : t.login}</button> <div className="absolute top-6 left-6"><button onClick={() => setLang(l => l==='ar'?'en':'ar')} className="text-xs font-bold text-slate-400 hover:text-brand-500">{lang==='ar'?'EN':'ع'}</button></div> </div> </div> );
        };

        const App = () => {
            const [user, setUser] = useState(null); const [lang, setLang] = useState(safeStorage.getItem('appLang') || 'ar');
            useEffect(() => { const q = window.matchMedia('(prefers-color-scheme: dark)'); if(q.matches) document.documentElement.classList.add('dark'); }, []);
            useEffect(() => { const { onAuthStateChanged } = window.firebaseModules; const unsub = onAuthStateChanged(window.auth, u => setUser(u)); return () => unsub(); }, []);
            useEffect(() => { document.documentElement.lang = lang; document.documentElement.dir = lang==='ar'?'rtl':'ltr'; safeStorage.setItem('appLang', lang); if(lang==='ar') document.body.classList.add('font-arabic'); else document.body.classList.remove('font-arabic'); }, [lang]);
            return user ? <Dashboard user={user} lang={lang} setLang={setLang} /> : <AuthScreen lang={lang} setLang={setLang} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
