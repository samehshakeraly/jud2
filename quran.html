<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متابع الورد (V30 - ثنائي اللغة)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 950: '#022c22' },
                        gold: { 500: '#d4af37' }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                        serif: ['Amiri', 'serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.5s ease; overflow-x: hidden; touch-action: manipulation; }
        html[lang="ع"] body { font-family: 'Inter', sans-serif; }
        .quran-font { font-family: 'Amiri', serif; }
        
        /* Glassmorphism & Styles */
        .glass-card { 
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .dark .glass-card {
            background: rgba(6, 78, 59, 0.6); 
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .islamic-pattern {
            background-color: transparent;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2310b981' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .prayer-checkbox:checked + div { background-color: #10b981; border-color: #059669; color: white; transform: scale(1.02); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .prayer-checkbox:checked + div .page-num { color: #d1fae5; }
        .prayer-checkbox:checked + div .icon-box { background-color: rgba(255,255,255,0.2); color: white; }
        .auth-input { @apply w-full pl-4 pr-11 py-3.5 rounded-2xl border border-gray-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition-all bg-white/60 dark:bg-emerald-900/40 dark:border-emerald-700 dark:text-white dark:focus:ring-emerald-800 text-sm font-semibold; }
        /* LTR Input Adjustment */
        html[lang="en"] .auth-input { @apply pr-4 pl-11; }
        html[lang="en"] .input-icon { left: 1rem; right: auto; }

        .cloud-status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transition: all 0.3s; }
        .status-online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-offline { background-color: #ef4444; }
        .loader-line { height: 2px; width: 100%; position: relative; overflow: hidden; background-color: rgba(255, 255, 255, 0.2); }
        .loader-line:before { display: block; position: absolute; content: ""; left: -200px; width: 200px; height: 2px; background-color: #ffffff; animation: loading 2s linear infinite; }
        @keyframes loading { from {left: -200px; width: 30%;} 50% {width: 30%;} 70% {width: 70%;} 80% { left: 50%;} 95% {left: 120%;} to {left: 100%;} }
        .balloon { position: fixed; top: 50%; left: 50%; z-index: 9999; pointer-events: none; line-height: 1; transform: translate(-50%, -50%) scale(0); animation: balloon-float ease-out forwards; }
        @keyframes balloon-float { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 10% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(var(--end-x), -120vh) rotate(var(--rot)) scale(1.2); opacity: 0.8; } }
    </style>
</head>
<body id="bodyEl" class="min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-500 bg-[#f0fdf4] dark:bg-emerald-950 text-slate-800 dark:text-slate-100">

    <div id="audioUnlocker" class="fixed inset-0 z-[99999] opacity-0" style="display: none;" onclick="window.unlockAudioContext()"></div>

    <div class="fixed top-4 left-4 z-50">
        </div>

    <div id="authScreen" class="w-full max-w-md p-8 glass-card rounded-[2rem] shadow-2xl relative overflow-hidden transition-all duration-500 hover:shadow-emerald-500/10 border-t border-white/60">
        <div class="absolute inset-0 islamic-pattern opacity-50 pointer-events-none"></div>
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-emerald-400 rounded-full blur-[80px] opacity-20"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-gold-500 rounded-full blur-[80px] opacity-20"></div>

        <button onclick="window.toggleLanguage()" class="absolute top-6 left-6 w-8 h-8 rounded-full bg-white/50 dark:bg-black/20 flex items-center justify-center text-sm shadow hover:scale-110 transition z-20">
            🌐
        </button>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-emerald-100 to-white dark:from-emerald-800 dark:to-emerald-900 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4 transform rotate-3">
                    <span class="text-3xl filter drop-shadow-sm">🕌</span>
                </div>
                <h1 id="txt_appTitle" class="text-3xl font-bold text-slate-800 dark:text-emerald-100 mb-1 tracking-tight">متابع الورد</h1>
                <p id="txt_appSubtitle" class="text-xs font-medium text-emerald-600 dark:text-emerald-400 uppercase tracking-widest opacity-80">Muslim Habit</p>
            </div>

            <div class="flex bg-gray-100/80 dark:bg-black/20 p-1.5 rounded-2xl mb-8 relative">
                <button onclick="window.switchAuthMode('login')" id="tabLogin" class="flex-1 py-2.5 text-sm font-bold rounded-xl bg-white dark:bg-emerald-700 shadow-sm text-emerald-700 dark:text-white transition-all duration-300">تسجيل دخول</button>
                <button onclick="window.switchAuthMode('register')" id="tabRegister" class="flex-1 py-2.5 text-sm font-bold rounded-xl text-gray-500 dark:text-gray-400 hover:text-emerald-600 transition-all duration-300">حساب جديد</button>
            </div>

            <form onsubmit="window.handleAuth(event)" class="space-y-5">
                <div class="relative group">
                    <div class="input-icon absolute top-1/2 -translate-y-1/2 right-4 text-gray-400 group-focus-within:text-emerald-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                    <input type="email" id="email" required class="auth-input" placeholder="البريد الإلكتروني">
                </div>
                <div class="relative group">
                    <div class="input-icon absolute top-1/2 -translate-y-1/2 right-4 text-gray-400 group-focus-within:text-emerald-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" id="password" required class="auth-input" placeholder="كلمة المرور">
                </div>
                <div id="authError" class="hidden text-xs text-red-500 bg-red-50 dark:bg-red-900/30 p-3 rounded-xl text-center font-bold border border-red-100 dark:border-red-800/50 flex items-center justify-center gap-2">
                    <span>⚠️</span> <span id="authErrorText"></span>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-500/30 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 group">
                    <span id="txt_startBtn">ابدأ الآن</span>
                    <svg class="w-4 h-4 transform group-hover:-translate-x-1 rtl:group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
            </form>
            <p id="txt_authFooter" class="text-center text-[10px] text-gray-400 mt-6">بمتابعتك فإنك توافق على الالتزام بالورد اليومي</p>
        </div>
    </div>

    <div id="mainApp" class="hidden w-full max-w-md glass-card rounded-3xl p-6 relative overflow-hidden bg-white/90 dark:bg-emerald-900/50 shadow-2xl border border-white/20">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-lg">👤</div>
                <div class="flex flex-col">
                    <span id="userEmailDisplay" class="text-[10px] text-gray-500 font-mono">...</span>
                    <div class="flex items-center gap-1">
                        <span id="cloudIndicator" class="cloud-status status-offline"></span>
                        <span id="cloudText" class="text-[9px] text-gray-400">غير متصل</span>
                    </div>
                </div>
            </div>
            <button onclick="window.logoutUser()" id="txt_logout" class="text-xs text-red-500 bg-red-50 px-3 py-1 rounded hover:bg-red-100 transition">خروج</button>
        </div>

        <div class="flex justify-between items-center mb-4 bg-gray-50 dark:bg-white/5 p-2 rounded-xl border border-gray-100 dark:border-gray-700">
            <div class="flex gap-2">
                <button onclick="window.toggleSound(event)" id="soundBtn" class="bg-white dark:bg-emerald-800 w-8 h-8 rounded-full shadow text-xs flex items-center justify-center transition hover:scale-110">🔊</button>
                <button onclick="window.toggleDarkMode()" class="bg-white dark:bg-emerald-800 w-8 h-8 rounded-full shadow text-xs flex items-center justify-center transition hover:scale-110">🌙</button>
                <button onclick="window.toggleLanguage()" class="bg-white dark:bg-emerald-800 w-8 h-8 rounded-full shadow text-xs flex items-center justify-center transition hover:scale-110 font-sans">EN</button>
            </div>
            <button onclick="window.toggleSimulator()" id="txt_simulator" class="text-[10px] text-emerald-600 bg-white px-3 py-1.5 rounded-full shadow-sm hover:bg-emerald-50 transition">⏱ المحاكاة</button>
        </div>

        <div class="text-center mb-6 relative">
            <span id="simulationBadge" class="hidden absolute top-0 left-0 bg-yellow-400 text-yellow-900 text-[9px] px-2 py-0.5 rounded-full font-bold">محاكاة</span>
            <h1 id="txt_dailyWird" class="text-2xl font-bold text-emerald-800 dark:text-emerald-300">وِرد اليوم</h1>
            <p id="dateDisplay" class="text-sm text-gray-500 mt-1">...</p>
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mt-3 overflow-hidden">
                <div id="dailyProgressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="progressLabel" class="text-xs text-gray-500 mt-2">0 من 5 صلوات</p>
        </div>

        <div class="bg-gradient-to-r from-teal-600 to-emerald-600 rounded-xl p-0 mb-6 text-white shadow-lg relative overflow-hidden min-h-[90px] flex flex-col transition-all hover:shadow-emerald-500/30 hover:scale-[1.01]">
            <div id="apiLoader" class="loader-line hidden z-30"></div>
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')] opacity-10"></div>
            <div class="p-4 flex-grow flex flex-col justify-center relative z-10">
                <div class="flex justify-between items-start w-full">
                    <div class="text-right rtl:border-l rtl:pl-3 ltr:border-r ltr:pr-3 border-white/20 w-1/2">
                        <span id="txt_startLabel" class="text-[10px] text-emerald-200">البداية (الفجر)</span>
                        <p id="startVerseInfo" class="font-bold quran-font text-sm leading-snug">--</p>
                    </div>
                    <div class="text-left rtl:pr-3 ltr:pl-3 w-1/2">
                        <span id="txt_endLabel" class="text-[10px] text-emerald-200">النهاية (العشاء)</span>
                        <p id="endVerseInfo" class="font-bold quran-font text-sm leading-snug">--</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="space-y-3 relative z-10" id="prayersList"></div>

        <button onclick="window.openResetModal()" id="txt_resetBtn" class="block mx-auto mt-6 text-[10px] text-gray-400 underline hover:text-red-500 transition">إعادة ضبط اليوم</button>

        <div id="simulatorPanel" class="hidden mt-4 p-3 bg-yellow-50 rounded-xl border border-yellow-100 text-center">
            <input type="date" id="simulatedDate" class="text-xs p-1 rounded border" onchange="window.manualUpdate()">
            <button onclick="window.resetToToday()" class="text-[10px] text-red-500 block mx-auto mt-1">إلغاء</button>
        </div>
    </div>

    <div id="resetModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
        <div class="bg-white dark:bg-emerald-900 rounded-2xl p-6 shadow-xl w-full max-w-sm border border-emerald-100 dark:border-emerald-700">
            <div class="text-center mb-4">
                <div class="w-10 h-10 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">⚠️</div>
                <h3 id="txt_resetTitle" class="text-lg font-bold text-gray-800 dark:text-white">تأكيد الإعادة</h3>
                <p id="txt_resetDesc" class="text-xs text-gray-500">سيتم مسح بيانات اليوم من السحابة</p>
            </div>
            <div class="flex gap-3">
                <button onclick="window.confirmReset()" id="txt_yes" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl text-sm font-bold transition">نعم</button>
                <button onclick="window.closeResetModal()" id="txt_no" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-bold transition">لا</button>
            </div>
        </div>
    </div>

    <script>
        // --- TRANSLATIONS (DICT) ---
        const translations = {
            ar: {
                appTitle: "متابع الورد", appSubtitle: "Muslim Habit",
                welcome: "مرحباً بك 👋", loginSub: "سجل دخولك لحفظ الورد في \"MuslimHabit\"",
                loginBtn: "دخول", registerBtn: "حساب جديد",
                emailPlaceholder: "البريد الإلكتروني", passPlaceholder: "كلمة المرور",
                startBtn: "ابدأ الآن", authFooter: "بمتابعتك فإنك توافق على الالتزام بالورد اليومي",
                logout: "خروج", online: "متصل", offline: "غير متصل",
                simulator: "⏱ المحاكاة", dailyWird: "وِرد اليوم",
                progressLabel: "{c} من 5 صلوات مكتملة",
                startLabel: "البداية (الفجر)", endLabel: "النهاية (العشاء)",
                resetBtn: "إعادة ضبط اليوم", resetTitle: "تأكيد الإعادة",
                resetDesc: "سيتم مسح بيانات اليوم من السحابة",
                yes: "نعم", no: "لا",
                surah: "سورة", ayah: "آية", page: "صفحة",
                prayers: ["الفجر", "الظهر", "العصر", "المغرب", "العشاء"],
                simulationBadge: "محاكاة",
                notStarted: "لم يبدأ الورد بعد (يبدأ 2026/1/1)"
            },
            en: {
                appTitle: "Quran Tracker", appSubtitle: "Muslim Habit",
                welcome: "Welcome 👋", loginSub: "Login to save progress in \"MuslimHabit\"",
                loginBtn: "Login", registerBtn: "Register",
                emailPlaceholder: "Email Address", passPlaceholder: "Password",
                startBtn: "Start Now", authFooter: "By continuing, you agree to the daily wird commitment",
                logout: "Logout", online: "Online", offline: "Offline",
                simulator: "⏱ Simulate", dailyWird: "Daily Wird",
                progressLabel: "{c} of 5 prayers completed",
                startLabel: "Start (Fajr)", endLabel: "End (Isha)",
                resetBtn: "Reset Today", resetTitle: "Confirm Reset",
                resetDesc: "Today's data will be erased from cloud",
                yes: "Yes", no: "No",
                surah: "Surah", ayah: "Ayah", page: "Page",
                prayers: ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"],
                simulationBadge: "Simulation",
                notStarted: "Wird has not started yet (Starts 2026/1/1)"
            }
        };

        // --- GLOBAL VARIABLES ---
        let currentLang = localStorage.getItem('appLang') || 'ar';
        const START_DATE_STR = '2026-01-01'; 
        const PAGES_PER_DAY = 5;
        const QURAN_PAGES = 604;
        let isSimulating = false, simulatedDateObj = new Date(), soundEnabled = true;
        let currentPrayersState = [false,false,false,false,false];
        let pageCache = {};
        try { if(localStorage.getItem('quran_cache')) pageCache = JSON.parse(localStorage.getItem('quran_cache')); } catch(e){}

        const prayerIcons = ["🌅", "☀️", "⛅", "🌇", "🌌"];

        // --- GLOBAL HELPERS ---
        window.safeSetText = function(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        };
        window.safeSetClass = function(id, className, action) {
            const el = document.getElementById(id);
            if (el) {
                if(action === 'add') el.classList.add(className);
                if(action === 'remove') el.classList.remove(className);
            }
        };
        window.safeSetStyle = function(id, property, value) {
            const el = document.getElementById(id);
            if (el) el.style[property] = value;
        };
        function getStorageKey() {
            const now = isSimulating ? new Date(simulatedDateObj) : new Date();
            return now.toISOString().split('T')[0];
        }

        // --- LANGUAGE LOGIC ---
        window.applyLanguage = function() {
            const t = translations[currentLang];
            const html = document.documentElement;
            html.lang = currentLang;
            html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            localStorage.setItem('appLang', currentLang);

            // Text Updates
            safeSetText('txt_appTitle', t.appTitle);
            safeSetText('txt_appSubtitle', t.appSubtitle);
            safeSetText('tabLogin', t.loginBtn);
            safeSetText('tabRegister', t.registerBtn);
            document.getElementById('email').placeholder = t.emailPlaceholder;
            document.getElementById('password').placeholder = t.passPlaceholder;
            safeSetText('txt_startBtn', t.startBtn);
            safeSetText('txt_authFooter', t.authFooter);
            safeSetText('txt_logout', t.logout);
            safeSetText('txt_simulator', t.simulator);
            safeSetText('txt_dailyWird', t.dailyWird);
            safeSetText('txt_startLabel', t.startLabel);
            safeSetText('txt_endLabel', t.endLabel);
            safeSetText('txt_resetBtn', t.resetBtn);
            safeSetText('txt_resetTitle', t.resetTitle);
            safeSetText('txt_resetDesc', t.resetDesc);
            safeSetText('txt_yes', t.yes);
            safeSetText('txt_no', t.no);
            safeSetText('simulationBadge', t.simulationBadge);
            safeSetText('cloudText', window.isOnline ? t.online : t.offline);
            
            // Re-render
            window.updateUI(false); 
        };

        window.toggleLanguage = function() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            window.applyLanguage();
        };

        // --- AUTH LOGIC ---
        window.currentAuthMode = 'login';
        window.switchAuthMode = function(mode) {
            window.currentAuthMode = mode;
            safeSetClass('authError', 'hidden', 'add');
            const t = translations[currentLang];
            if (mode === 'login') {
                safeSetClass('tabLogin', 'text-emerald-700', 'add');
                safeSetClass('tabRegister', 'text-gray-500', 'add');
                safeSetClass('tabLogin', 'dark:bg-emerald-700', 'add');
                safeSetClass('tabRegister', 'dark:bg-emerald-700', 'remove');
                safeSetClass('tabLogin', 'bg-white', 'add');
                safeSetClass('tabRegister', 'bg-white', 'remove');
                safeSetText('txt_startBtn', t.loginBtn);
            } else {
                safeSetClass('tabRegister', 'text-emerald-700', 'add');
                safeSetClass('tabLogin', 'text-gray-500', 'add');
                safeSetClass('tabRegister', 'dark:bg-emerald-700', 'add');
                safeSetClass('tabLogin', 'dark:bg-emerald-700', 'remove');
                safeSetClass('tabRegister', 'bg-white', 'add');
                safeSetClass('tabLogin', 'bg-white', 'remove');
                safeSetText('txt_startBtn', t.registerBtn);
            }
        };

        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            safeSetClass('authError', 'hidden', 'add');
            btn.disabled = true; 
            
            try {
                if(!window.authAPI) throw "Connection initializing...";
                if(window.currentAuthMode === 'login' || !window.currentAuthMode) {
                    await window.authAPI.login(email, password);
                } else {
                    await window.authAPI.register(email, password);
                }
            } catch(err) {
                safeSetText('authErrorText', err);
                safeSetClass('authError', 'hidden', 'remove');
            } finally {
                btn.disabled = false;
            }
        };
        window.logoutUser = async function() { 
            const msg = currentLang === 'ar' ? 'تسجيل خروج؟' : 'Logout?';
            if(confirm(msg)) window.authAPI.logout(); 
        }

        // --- AUDIO & EFFECTS ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        window.initAudioContext = function() { if (!audioCtx) audioCtx = new AudioContext(); return audioCtx; }
        window.unlockAudioContext = function() {
            const ctx = window.initAudioContext();
            if (ctx.state === 'suspended') {
                ctx.resume().then(() => {
                    const unlocker = document.getElementById('audioUnlocker');
                    if (unlocker) unlocker.style.display = 'none';
                });
            }
        }
        window.playPopSound = function() {
            if (!soundEnabled) return;
            const ctx = window.initAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(400 + Math.random() * 200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        };
        window.playClickSound = function() {
            if (!soundEnabled) return;
            const ctx = window.initAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        };
        window.triggerCelebration = function() {
            const container = document.body;
            if(soundEnabled) { [0, 150, 300, 450, 600, 800].forEach(t => setTimeout(() => window.playPopSound(), t)); }
            for (let i = 0; i < 40; i++) {
                const el = document.createElement('div');
                el.innerText = '🎈'; el.className = 'balloon';
                el.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg)`;
                el.style.setProperty('--end-x', `${(Math.random() - 0.5) * 120}vw`);
                el.style.setProperty('--rot', `${(Math.random() - 0.5) * 45}deg`);
                el.style.fontSize = (Math.random() * 30 + 30) + 'px';
                el.style.animationDuration = (Math.random() * 2 + 3) + 's';
                container.appendChild(el);
                setTimeout(() => { el.remove(); }, 6000);
            }
        };
        window.toggleSound = function(e) {
            if(e) e.stopPropagation();
            soundEnabled = !soundEnabled;
            safeSetText('soundBtn', soundEnabled ? '🔊' : '🔇');
            if(soundEnabled) window.playClickSound();
        };

        // --- UI & SIMULATOR ---
        window.toggleDarkMode = function() {
            document.documentElement.classList.toggle('dark');
        };
        window.toggleSimulator = function() { 
            const panel = document.getElementById('simulatorPanel');
            if(panel) panel.classList.toggle('hidden'); 
        };
        window.manualUpdate = function() {
            const val = document.getElementById('simulatedDate').value;
            if(val) { 
                isSimulating = true; 
                simulatedDateObj = new Date(val); 
                safeSetClass('simulationBadge', 'hidden', 'remove'); 
                window.updateUI(true); 
            }
        };
        window.resetToToday = function() { 
            isSimulating = false; 
            document.getElementById('simulatedDate').value = ''; 
            safeSetClass('simulationBadge', 'hidden', 'add'); 
            window.updateUI(true); 
        };
        window.openResetModal = function() { safeSetClass('resetModal', 'hidden', 'remove'); };
        window.closeResetModal = function() { safeSetClass('resetModal', 'hidden', 'add'); };
        window.confirmReset = function() {
            if (window.firebaseAPI) window.firebaseAPI.saveProgress(getStorageKey(), [false,false,false,false,false]);
            window.closeResetModal();
        };
        window.openQuranPage = function(pageNum) { window.open(`https://quran.com/page/${pageNum}`, '_blank'); };

        // --- RENDER & LOGIC ---
        window.togglePrayer = function(index) {
            window.unlockAudioContext();
            const dateStr = getStorageKey();
            const newData = [...currentPrayersState];
            newData[index] = !newData[index];
            currentPrayersState = newData; 
            window.renderPrayersList();
            if (newData[index]) {
                if (newData.every(Boolean)) triggerCelebration();
                else playClickSound();
            }
            if (window.firebaseAPI) window.firebaseAPI.saveProgress(dateStr, newData);
        };

        window.renderPrayersList = function() {
            const t = translations[currentLang];
            const now = isSimulating ? new Date(simulatedDateObj) : new Date();
            now.setHours(0,0,0,0);
            const startDate = new Date(START_DATE_STR);
            startDate.setHours(0,0,0,0);
            const diffTime = now - startDate;
            
            const listContainer = document.getElementById('prayersList');
            if(!listContainer) return;

            if (diffTime < 0) { listContainer.innerHTML = `<p class='text-center text-sm'>${t.notStarted}</p>`; return; }
            
            const dayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const globalStartPage = (dayIndex * PAGES_PER_DAY) + 1;
            
            listContainer.innerHTML = '';
            let completedCount = 0;

            prayerIcons.forEach((icon, index) => {
                const isChecked = currentPrayersState[index];
                if (isChecked) completedCount++;
                let pageNumDisplay = ((globalStartPage + index - 1) % QURAN_PAGES) + 1;
                let prayerName = t.prayers[index];

                const item = document.createElement('div');
                item.innerHTML = `
                    <label class="cursor-pointer block relative group">
                        <input type="checkbox" class="prayer-checkbox hidden" onchange="window.togglePrayer(${index})" ${isChecked ? 'checked' : ''}>
                        <div class="prayer-item flex items-center justify-between p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-emerald-900/40 hover:border-emerald-300 transition-all shadow-sm">
                            <div class="flex items-center gap-3">
                                <div class="icon-box w-8 h-8 rounded-full bg-emerald-50 dark:bg-emerald-800 flex items-center justify-center text-lg transition-colors">${icon}</div>
                                <div class="flex flex-col">
                                    <span class="font-bold text-sm text-gray-800 dark:text-gray-200">${prayerName}</span>
                                    <span class="text-[10px] text-gray-400 page-num transition-colors">${t.page} <strong class="text-emerald-600 dark:text-emerald-400 font-serif">${pageNumDisplay}</strong></span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="event.preventDefault(); window.openQuranPage(${pageNumDisplay})" class="text-[10px] bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded hover:bg-emerald-100 text-gray-600 dark:text-gray-300 transition z-20">📖</button>
                                <div class="w-6 h-6 rounded-full border-2 border-gray-300 dark:border-gray-600 flex items-center justify-center">${isChecked ? '✓' : ''}</div>
                            </div>
                        </div>
                    </label>
                `;
                listContainer.appendChild(item);
            });

            const percentage = (completedCount / 5) * 100;
            safeSetStyle('dailyProgressBar', 'width', `${percentage}%`);
            safeSetText('progressLabel', t.progressLabel.replace('{c}', completedCount));
            
            const bar = document.getElementById('dailyProgressBar');
            if(bar) {
                if(completedCount === 5) { bar.classList.add('bg-gold-500'); bar.classList.remove('bg-emerald-500'); }
                else { bar.classList.add('bg-emerald-500'); bar.classList.remove('bg-gold-500'); }
            }
        };

        // --- API HANDLER ---
        async function fetchPageDetails(pageNum) {
            if (pageCache[pageNum]) return pageCache[pageNum];
            if (pageNum === 1) return { start: {n: "الفاتحة", en:"Al-Fatiha", a: 1}, end: {n: "الفاتحة", en:"Al-Fatiha", a: 7} };
            if (pageNum === 2) return { start: {n: "البقرة", en:"Al-Baqarah", a: 1}, end: {n: "البقرة", en:"Al-Baqarah", a: 5} };

            try {
                const response = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
                const data = await response.json();
                if (data.code === 200 && data.data.ayahs.length > 0) {
                    const ayahs = data.data.ayahs;
                    const info = { 
                        start: { n: ayahs[0].surah.name, en: ayahs[0].surah.englishName, a: ayahs[0].numberInSurah }, 
                        end: { n: ayahs[ayahs.length - 1].surah.name, en: ayahs[ayahs.length - 1].surah.englishName, a: ayahs[ayahs.length - 1].numberInSurah } 
                    };
                    pageCache[pageNum] = info;
                    try { localStorage.setItem('quran_cache', JSON.stringify(pageCache)); } catch(e) {}
                    return info;
                }
            } catch (e) { console.error("API Error", e); }
            return { start: {n: "...", en:"...", a: "?"}, end: {n: "...", en:"...", a: "?"} };
        }

        async function updateVerseRange(startP, endP) {
            const loader = document.getElementById('apiLoader');
            if(!pageCache[startP] && loader) loader.classList.remove('hidden');
            const sInfo = await fetchPageDetails(startP);
            const eInfo = await fetchPageDetails(endP);
            const t = translations[currentLang];
            
            const sName = currentLang === 'ar' ? sInfo.start.n : sInfo.start.en;
            const eName = currentLang === 'ar' ? eInfo.end.n : eInfo.end.en;
            
            safeSetText('startVerseInfo', `${sName} - ${t.ayah} ${sInfo.start.a}`);
            safeSetText('endVerseInfo', `${eName} - ${t.ayah} ${eInfo.end.a}`);
            if(loader) loader.classList.add('hidden');
        }

        window.updateUI = function(shouldFetchApi = true) {
            const now = isSimulating ? new Date(simulatedDateObj) : new Date();
            now.setHours(0,0,0,0);
            const startDate = new Date(START_DATE_STR);
            startDate.setHours(0,0,0,0);
            
            const locale = currentLang === 'ar' ? 'ar-KW' : 'en-US';
            safeSetText('dateDisplay', now.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }));
            
            const diffTime = now - startDate;
            
            if (diffTime >= 0) {
                const dayIndex = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const globalStartPage = (dayIndex * PAGES_PER_DAY) + 1;
                const todayStartPage = ((globalStartPage - 1) % QURAN_PAGES) + 1;
                const todayEndPage = ((globalStartPage + 4 - 1) % QURAN_PAGES) + 1;
                if(shouldFetchApi) updateVerseRange(todayStartPage, todayEndPage);
                loadPrayersData(getStorageKey());
            } else {
                safeSetText('startVerseInfo', "--");
                safeSetText('endVerseInfo', "--");
            }
        };

        function loadPrayersData(dateStr) {
            if(window.firebaseAPI) {
                window.firebaseAPI.subscribeToDate(dateStr, (data) => {
                    currentPrayersState = data;
                    window.renderPrayersList();
                });
            }
        }

        // Init Interactions & Language
        ['click', 'touchstart', 'touchend'].forEach(event => {
            document.body.addEventListener(event, window.unlockAudioContext, { once: true });
        });
        
        // Initial Lang Apply
        window.addEventListener('DOMContentLoaded', window.applyLanguage);
    </script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBSMaNzhzKCtfQcL7kyCoz6CWmQM4pMsds",
            authDomain: "muslimhabit-b21fd.firebaseapp.com",
            projectId: "muslimhabit-b21fd",
            storageBucket: "muslimhabit-b21fd.firebasestorage.app",
            messagingSenderId: "250434152968",
            appId: "1:250434152968:web:3b9ed463db1c0e873a3fbd",
            measurementId: "G-9BR2F65RGC"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            let unsubscribeDoc = null;
            let currentUser = null;

            window.authAPI = {
                login: async (email, password) => {
                    try { await signInWithEmailAndPassword(auth, email, password); } 
                    catch (e) { throw e.code; }
                },
                register: async (email, password) => {
                    try { await createUserWithEmailAndPassword(auth, email, password); } 
                    catch (e) { throw e.code; }
                },
                logout: async () => {
                    if (unsubscribeDoc) unsubscribeDoc();
                    await signOut(auth);
                }
            };

            window.firebaseAPI = {
                subscribeToDate: (dateStr, callback) => {
                    if (!db || !currentUser) return;
                    if (unsubscribeDoc) unsubscribeDoc();
                    const docPath = doc(db, 'users', currentUser.uid, 'daily_reads', dateStr);
                    unsubscribeDoc = onSnapshot(docPath, (snap) => {
                        if (snap.exists()) callback(snap.data().prayers || [false,false,false,false,false]);
                        else callback([false,false,false,false,false]);
                    });
                },
                saveProgress: async (dateStr, data) => {
                    if (!db || !currentUser) return;
                    const docPath = doc(db, 'users', currentUser.uid, 'daily_reads', dateStr);
                    await setDoc(docPath, { prayers: data, lastUpdated: new Date().toISOString() }, { merge: true });
                }
            };

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                window.isOnline = !!user;
                const authScreen = document.getElementById('authScreen');
                const mainApp = document.getElementById('mainApp');
                const t = translations[currentLang || 'ar'];
                
                if (user) {
                    if(authScreen) authScreen.classList.add('hidden');
                    if(mainApp) mainApp.classList.remove('hidden');
                    safeSetText('userEmailDisplay', user.email);
                    safeSetClass('cloudIndicator', 'status-online', 'add');
                    safeSetClass('cloudIndicator', 'status-offline', 'remove');
                    safeSetText('cloudText', t.online);
                    
                    if(window.updateUI) window.updateUI(true); 
                } else {
                    if(authScreen) authScreen.classList.remove('hidden');
                    if(mainApp) mainApp.classList.add('hidden');
                }
            });

        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
    </script>
</body>
