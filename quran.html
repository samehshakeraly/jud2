<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابع الورد - Muslim Habit</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات عامة */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f0faf9; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        
        /* البطاقة */
        .card { background: linear-gradient(135deg, #ffffff 0%, #f7fcfc 100%); width: 90%; max-width: 400px; border-radius: 30px; padding: 30px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); position: relative; text-align: center; }
        
        /* أيقونة اللغة */
        .lang-icon { position: absolute; top: 25px; left: 25px; width: 35px; height: 35px; border-radius: 50%; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; color: #10a37f; cursor: pointer; background: white; }
        
        /* الشعار */
        .logo-container { width: 80px; height: 80px; background: #fff; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 20px auto 10px; }
        
        /* العناوين */
        h1 { color: #1f2937; font-size: 24px; font-weight: 700; margin-bottom: 2px; }
        .subtitle { color: #10b981; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 30px; font-weight: 600; }
        
        /* التبويبات */
        .tabs { display: flex; background: #f3f4f6; padding: 5px; border-radius: 15px; margin-bottom: 25px; }
        .tab { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; border-radius: 12px; font-weight: 600; font-size: 14px; color: #6b7280; transition: all 0.3s ease; }
        .tab.active { background: #fff; color: #1f2937; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* حقول الإدخال */
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px 50px 15px 15px; border: none; background: #f9fafb; border-radius: 12px; font-size: 14px; outline: none; text-align: right; color: #374151; transition: background 0.3s; }
        .input-group input:focus { background: #fff; box-shadow: 0 0 0 2px #10b9811a; }
        .input-icon { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); color: #9ca3af; font-size: 18px; pointer-events: none; }
        
        /* زر الدخول */
        .submit-btn { width: 100%; padding: 15px; background-color: #059669; color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; margin-bottom: 20px; transition: all 0.3s; }
        .submit-btn:hover { background-color: #047857; transform: translateY(-1px); }
        
        /* تذييل */
        .footer-text { color: #9ca3af; font-size: 11px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="lang-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </div>

        <div class="logo-container">🕌</div>
        <h1>متابع الورد</h1>
        <div class="subtitle">MUSLIM HABIT</div>

        <div class="tabs">
            <button class="tab">حساب جديد</button>
            <button class="tab active">دخول</button>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <span class="input-icon">✉️</span>
                <input type="email" id="email" placeholder="البريد الإلكتروني" dir="rtl" required>
            </div>

            <div class="input-group">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" placeholder="كلمة المرور" dir="rtl" required>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">
                <span id="btnText">دخول</span>
                <span id="btnIcon">←</span>
            </button>
        </form>

        <div class="footer-text">
            بمتابعتك فإنك توافق على الالتزام بالورد اليومي
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); 

            // التحقق من أن الحقول ليست فارغة
            if(emailInput.value && passwordInput.value) {
                
                // تغيير حالة الزر
                btnText.textContent = "جاري الدخول...";
                loginBtn.style.opacity = "0.7";
                
                setTimeout(() => {
                    // **هنا تم التعديل لتوجيهك لصفحة القرآن**
                    window.location.href = "quran.html"; 
                }, 1000);
            }
        });
    </script>
</body>
</html>
